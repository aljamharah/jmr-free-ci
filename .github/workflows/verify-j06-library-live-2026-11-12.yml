name: Verify J-06 reader navigation and J-08 mobile controls on live Production
on:
  push:
    branches: [ci/j06-library-reader-live-2026-11-12]
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check deployed library, book, reader and navigation helper
        run: |
          node --input-type=module <<'NODE'
          const base='https://aljamharah.pages.dev';
          const requirements=[
            ['library.html','const initialLibraryState=','libraryNav.book(book.id,libraryOrigin())'],
            ['book.html','libraryNav.reader(id,"external",libraryOrigin?.href)','libraryOrigin.href+"#booksSection"'],
            ['reader.html','libraryNav.book(id,libraryOrigin?.href)','$("#backToBook").href='],
            ['assets/jamharah-library-navigation.js','root.JamharahLibraryNav=Object.freeze({create,parse,book,reader})','const SUBS='],
            ['library.html','.page-button{min-width:44px;height:44px;','.subfilters .subfilter{min-height:44px;']
          ];
          let ready=false;
          for(let attempt=0;attempt<16;attempt++){
            let passed=0;
            for(const [path,a,b] of requirements){
              const response=await fetch(base+'/'+path,{headers:{'Cache-Control':'no-cache'},signal:AbortSignal.timeout(12000)});
              const body=await response.text();
              if(response.status===200&&body.includes(a)&&body.includes(b))passed++;
            }
            ready=passed===requirements.length;
            console.log('J06_LIBRARY_LIVE',JSON.stringify({attempt:attempt+1,passed,total:requirements.length}));
            if(ready)break;
            await new Promise(r=>setTimeout(r,7000));
          }
          const home=await fetch(base+'/',{signal:AbortSignal.timeout(12000)});
          const index=await fetch(base+'/content/books/index.json',{signal:AbortSignal.timeout(12000)});
          console.log('J06_HOME',home.status);
          console.log('J06_BOOK_INDEX',index.status);
          console.log('J06_J08_LIBRARY_LIVE_DEPLOYED',ready?'PASS':'NOT_VERIFIED');
          if(!ready||home.status!==200||index.status!==200)process.exitCode=1;
          NODE
