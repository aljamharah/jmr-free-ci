name: Reconciled header PR48 on released Jamharah foundation

on:
  push:
    branches: [ci/reconciled-header-pr48-2026-11-11]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          repository: aljamharah/aljamharah
          ref: engineering/reconcile-header-pr48-after-release-2026-11-11
          token: ${{ secrets.JMR_PRIVATE_REPO_READ_TOKEN }}
          path: source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Foundation regression, including header icon parity
        working-directory: source
        run: node scripts/check_site_foundation.mjs
      - name: Install free browser test framework
        working-directory: source
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          if ! command -v google-chrome >/dev/null 2>&1; then
            npx playwright install --with-deps chromium
          fi
      - name: Run Chromium mobile/desktop flows against sanitized dist
        working-directory: source
        run: node scripts/test_browser_navigation.mjs
      - name: Check clean source after all tests
        working-directory: source
        run: git diff --exit-code -- .
