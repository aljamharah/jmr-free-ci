name: Final PR226 red-harakat source integrity and deployment gate
on:
  push:
    branches: [audit/poetry-red-226-final-20261118]
permissions:
  contents: read
jobs:
  validate:
    if: github.repository == 'aljamharah/jmr-free-ci'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          repository: aljamharah/aljamharah
          ref: 667b683b797bdea96d5f65a596062e4c0cc60474
          token: ${{ secrets.JMR_PRIVATE_REPO_READ_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Free test requirements
        run: python -m pip install --disable-pip-version-check python-frontmatter pyyaml
      - name: Require audited immutable source
        run: test "$(git rev-parse HEAD)" = '667b683b797bdea96d5f65a596062e4c0cc60474'
      - name: All source-collated red harakat and no-conflict tests
        run: |
          node --test tests/editorial/classics-source-vocalization.test.mjs tests/editorial/poetry-source-collation-harakat.test.mjs tests/editorial/poems-completeness-regression.test.mjs tests/editorial/poetry-fixed-particles-harakat.test.mjs
          node --test tests/poem-red-diacritics-runtime.test.mjs tests/poem-red-diacritics-no-heading.test.mjs
      - name: Library, foundation, full suite and sanitized build
        run: |
          python scripts/validate_library.py
          node scripts/check_site_foundation.mjs
          npm test
          node scripts/build_public_site.mjs
      - name: Ensure read-only checkout never changes poem source
        run: git diff --exit-code -- content/poems.json poem.html tests/
