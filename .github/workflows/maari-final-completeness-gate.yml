name: Maarri final and complete poetry integrity read-only gate
on:
  push:
    branches:
      - maari/intake-20261118
permissions:
  contents: read
jobs:
  validate:
    if: github.repository == 'aljamharah/jmr-free-ci'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact private revision read-only
        uses: actions/checkout@v4
        with:
          repository: aljamharah/aljamharah
          ref: ddd20d864e533c5fddaba923ecd9ba43eb07655e
          token: ${{ secrets.JMR_PRIVATE_REPO_READ_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install free validation dependencies
        run: python -m pip install --disable-pip-version-check python-frontmatter pyyaml
      - name: Verify fixed head SHA
        run: test "$(git rev-parse HEAD)" = 'ddd20d864e533c5fddaba923ecd9ba43eb07655e'
      - name: Verify all 91 Maarri poems and all published body counts
        run: node --test tests/editorial/maari-batch01-index.test.mjs tests/editorial/poems-completeness-regression.test.mjs
      - name: Verify safe editorial and source policies
        run: python scripts/validate_library.py
      - name: Foundation regression and full unit suite
        run: |
          node scripts/check_site_foundation.mjs
          npm test
      - name: Build sanitized public site
        run: node scripts/build_public_site.mjs
      - name: Ensure validation did not change canonical sources
        run: git diff --exit-code -- content/poems.json tests/editorial/maari-batch01-index.test.mjs tests/editorial/poems-completeness-regression.test.mjs
