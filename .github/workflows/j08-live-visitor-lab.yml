name: J08 live production visitor journeys, accessibility and lab speed
# TEST-01 2026-11-18: rerun existing read-only production browser and accessibility suite.
# Results apply to the Production release active during the run; verify its SHA separately.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/j08-live-visitor-lab.yml"
      - "scripts/j08-live-visitor-lab.mjs"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: j08-live-visitor-audit
  cancel-in-progress: false

jobs:
  chromium:
    if: github.repository == 'aljamharah/jmr-free-ci' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out public test harness with no persistent credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install disposable browser and accessibility test dependencies
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/j08-lab"
          cd "$RUNNER_TEMP/j08-lab"
          npm install --no-audit --no-fund --no-save --package-lock=false playwright@1.56.1 axe-core@4.10.3 >/dev/null
          if ! command -v google-chrome >/dev/null 2>&1; then npx playwright install chromium >/dev/null; fi
      - name: Audit live public production (GET-only, 3 viewports, performance, search, axe)
        shell: bash
        run: |
          set -euo pipefail
          cp scripts/j08-live-visitor-lab.mjs "$RUNNER_TEMP/j08-lab/visitor-lab.mjs"
          cd "$RUNNER_TEMP/j08-lab"
          node visitor-lab.mjs
