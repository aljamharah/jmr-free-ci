name: JMR retrieval quality live non-billable health check
on:
  push:
    branches: [ci/jmr-retrieval-live-2026-11-12]
permissions:
  contents: read
jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check live JMR interface, static search, guards without AI calls
        run: |
          node --input-type=module <<'NODE'
          const base='https://aljamharah.pages.dev';
          const checked=['/','/jmr.html','/search.html','/content/books/index.json',
            '/content/poets.json','/content/poems.json'];
          for(const path of checked){
            const response=await fetch(base+path,{signal:AbortSignal.timeout(14000)});
            console.log('LIVE_PUBLIC',path,response.status);
            if(!response.ok)process.exitCode=1;
            if(path==='/jmr.html'){
              const body=await response.text();
              if(!body.includes('صفحات منشورة ذات صلة في الجمهرة'))process.exitCode=1;
            }
          }
          const api=await fetch(base+'/api/jmr',{method:'GET',signal:AbortSignal.timeout(14000)});
          const error=await api.json().catch(()=>null);
          console.log('LIVE_JMR_METHOD_GUARD',api.status,error?.error);
          if(api.status!==405)process.exitCode=1;
          const body=await fetch(base+'/api/jmr',{
            method:'POST',
            headers:{Origin:base,'Content-Type':'application/json'},
            body:'{',
            signal:AbortSignal.timeout(14000)
          });
          const parsed=await body.json().catch(()=>null);
          console.log('LIVE_JMR_MALFORMED_REQUEST_GUARD',body.status,parsed?.error);
          if(body.status!==400)process.exitCode=1;
          console.log('JMR_SAFE_SMOKE',process.exitCode?'FAILED':'PASS');
          console.log('NO_LIVE_MODEL_QUALITY_CLAIM=true');
          NODE
