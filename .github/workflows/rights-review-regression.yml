name: Validate staged Jamharah rights safeguards

on:
  push:
    branches:
      - ci/rights-review-2026-11-11
    paths:
      - ".github/workflows/rights-review-regression.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rights-regression:
    if: github.actor == 'aljamharah'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require read-only private-source token
        env:
          PRIVATE_TOKEN: ${{ secrets.JMR_PRIVATE_REPO_READ_TOKEN }}
        run: |
          test -n "$PRIVATE_TOKEN" || { echo "::error::Missing read-only source token"; exit 1; }
      - name: Checkout the isolated stabilization branch without stored credentials
        uses: actions/checkout@v4
        with:
          repository: aljamharah/aljamharah
          ref: stabilize/foundation-safe-2026-11-11
          token: ${{ secrets.JMR_PRIVATE_REPO_READ_TOKEN }}
          persist-credentials: false
          path: private-source
      - name: Set up Python and Node
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install test-only dependencies
        run: python -m pip install --disable-pip-version-check python-frontmatter pyyaml
      - name: Validate rights filtering, all current books, and protected reader
        working-directory: private-source
        run: python scripts/validate_library.py
      - name: Check Python source and JSON schema syntax
        working-directory: private-source
        run: |
          python -m py_compile scripts/build_library_index.py scripts/validate_library.py
          python -c "import json; from pathlib import Path; json.loads(Path('content/books/book-schema.json').read_text(encoding='utf-8')); print('Book schema JSON valid')"
      - name: Ensure existing web UI and canonical logo paths remain unchanged
        working-directory: private-source
        run: |
          python - <<'PY'
          import subprocess
          important=['index.html','lexicon.html','library.html','catalog.html','assets/AFF71118-81CC-48DF-A661-4410C687EC8F.png']
          for name in important:
              assert __import__('pathlib').Path(name).is_file(), f'Missing protected file: {name}'
          print('Protected UI files and canonical logo are present')
          PY
