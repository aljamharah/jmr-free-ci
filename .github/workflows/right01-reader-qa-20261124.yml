name: RIGHT-01 reader QA (exact private SHA, read-only)
on:
  push:
    branches: [main]
    paths: [".github/workflows/right01-reader-qa-20261124.yml"]
permissions:
  contents: read
concurrency:
  group: right01-reader-qa
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository == 'aljamharah/jmr-free-ci' && github.ref == 'refs/heads/main' && github.actor == 'aljamharah'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          repository: aljamharah/aljamharah
          ref: a8d9b1ae5fafaf3588a12331a6a77e705fe6cdb3
          token: ${{ secrets.JMR_PRIVATE_REPO_READ_TOKEN }}
          path: source
          persist-credentials: false
      - name: Require reviewed immutable private SHA
        id: pin
        working-directory: source
        run: |
          test "$(git rev-parse HEAD)" = "a8d9b1ae5fafaf3588a12331a6a77e705fe6cdb3"
          echo RIGHT01_READER_SHA_PASS
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run targeted reader regression
        working-directory: source
        run: |
          if node --test tests/right01-reader-volume-consistency.test.mjs > "$RUNNER_TEMP/right01-reader.log" 2>&1; then
            echo RIGHT01_READER_TEST_PASS
          else
            echo "::error::RIGHT01_READER_TEST_FAIL (private logs withheld)"
            exit 1
          fi
      - name: Run full private foundation
        if: always() && steps.pin.outcome == 'success'
        working-directory: source
        run: |
          python -m pip install --disable-pip-version-check python-frontmatter pyyaml > /dev/null 2>&1
          if node scripts/check_site_foundation.mjs > "$RUNNER_TEMP/right01-foundation.log" 2>&1; then
            echo RIGHT01_FOUNDATION_PASS
          else
            echo "::error::RIGHT01_FOUNDATION_FAIL (private logs withheld)"
            node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          const log=readFileSync(process.env.RUNNER_TEMP+'/right01-foundation.log','utf8');
          const labels=['Internal page/asset references','Sanitized deploy-only dist and draft privacy','Unified header and functional search navigation','Lexicon integrity','Lexicon fast search','Quran corpus integrity','JMR API behavior and input guards','JMR failure paths, free-tier quota and rate limits','JMR runtime regression tests','Node unit tests'];
          for(const label of labels){
            if(log.includes('FAILED: '+label+' ('))console.log('RIGHT01_FAILED_SUITE='+label);
            if(log.includes('PASSED: '+label))console.log('RIGHT01_PASSED_SUITE='+label);
          }
          NODE
            for file in tests/book-archive-reader-footer.test.mjs tests/book-archive-verified-subprefixes.test.mjs tests/book-pdf-pagination.test.mjs tests/book-printed-edition-access.test.mjs tests/book-reader-first-pdf-collapse.test.mjs tests/books-original-archive-pdf-links.test.mjs tests/j06-library-book-reader-navigation.test.mjs tests/right01-public-books-rights-gate.test.mjs tests/public-content-export-policy.test.mjs; do
              if node --test "$file" > "$RUNNER_TEMP/right01-component.log" 2>&1; then
                echo "RIGHT01_COMPONENT_PASS=$file"
              else
                echo "RIGHT01_COMPONENT_FAIL=$file"
              fi
            done
            exit 1
          fi
      - name: Check Archive metadata, HEAD and bounded PDF signature
        if: always() && steps.pin.outcome == 'success'
        working-directory: source
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          const index=JSON.parse(readFileSync('content/books/index.json','utf8'));
          const records=index.books.map(b=>JSON.parse(readFileSync(b.record,'utf8')));
          const groups=new Map();
          const counts={records:records.length,invalid:0,metadataFailures:0,restricted:0,missing:0,unavailable:0,headPass:0,rangePass:0,headUnknown:0};
          for(const record of records){
            const match=/^https:\/\/archive\.org\/details\/([A-Za-z0-9][A-Za-z0-9._-]{0,100})$/.exec(record.archive_item_url||'');
            if(!match){counts.invalid++;continue}
            const item=match[1];
            const urls=[record.archive_pdf_source_url,record.archive_cover_pdf_source_url,...(record.archive_pdf_files||[]).map(f=>f.url)].filter(Boolean);
            if(!record.archive_pdf_source_url)counts.invalid++;
            if(!groups.has(item))groups.set(item,new Set());
            for(const raw of urls){
              try{
                const u=new URL(raw),prefix='/download/'+item+'/';
                if(u.origin!=='https://archive.org'||u.username||u.password||u.search||u.hash||!u.pathname.startsWith(prefix))throw Error();
                const name=decodeURIComponent(u.pathname.slice(prefix.length));
                if(!name||name.includes('/')||name.includes('\\')||!name.toLowerCase().endsWith('.pdf'))throw Error();
                groups.get(item).add(name);
              }catch{counts.invalid++}
            }
          }
          const yes=v=>v===true||v===1||v==='true'||v==='1';
          async function request(url,method){
            for(let i=0;i<5;i++){
              const u=new URL(url);
              if(u.protocol!=='https:'||!(u.hostname==='archive.org'||u.hostname.endsWith('.archive.org'))||u.username||u.password)return null;
              const r=await fetch(u,{method,headers:method==='GET'?{'Range':'bytes=0-1023','Accept-Encoding':'identity'}:{},redirect:'manual',signal:AbortSignal.timeout(18000)});
              if(r.status>=300&&r.status<400&&r.headers.get('location')){
                if(r.body)await r.body.cancel().catch(()=>{});
                url=new URL(r.headers.get('location'),u).href;continue;
              }
              return r;
            }
            return null;
          }
          async function head(url){
            const r=await request(url,'HEAD');
            if(!r)return 'unknown';
            if(r.ok&&/application\/pdf/i.test(r.headers.get('content-type')||'')&&Number(r.headers.get('content-length'))>0)return 'pass';
            if([401,403,404,410,451].includes(r.status))return 'unavailable';
            return 'unknown';
          }
          async function rangeProbe(url){
            const r=await request(url,'GET');
            if(!r)return 'unknown';
            if(![200,206].includes(r.status)){
              if(r.body)await r.body.cancel().catch(()=>{});
              return [401,403,404,410,451].includes(r.status)?'unavailable':'unknown';
            }
            if(!r.body)return 'unknown';
            const reader=r.body.getReader();
            let first=new Uint8Array(0);
            try{
              while(first.length<1024){
                const {done,value}=await reader.read();
                if(done)break;
                const take=value.subarray(0,1024-first.length);
                const next=new Uint8Array(first.length+take.length);
                next.set(first);next.set(take,first.length);first=next;
                if(new TextDecoder().decode(first).includes('%PDF-'))return 'pass';
              }
              return 'unknown';
            }finally{await reader.cancel().catch(()=>{});}
          }
          const unresolved=[];
          const ordinals=new Map();
          let ordinal=0;
          for(const [item,files] of groups)for(const file of files)ordinals.set(item+'/'+file,++ordinal);
          async function verify([item,files]){
            let data;
            try{
              const response=await fetch('https://archive.org/metadata/'+encodeURIComponent(item),{redirect:'error',signal:AbortSignal.timeout(20000)});
              if(!response.ok)throw Error();
              data=await response.json();
              if(!Array.isArray(data.files)||!data.metadata)throw Error();
            }catch{counts.metadataFailures++;return}
            if(yes(data.is_dark)||yes(data.metadata['access-restricted-item'])){counts.restricted+=files.size;return}
            for(const file of files){
              const entry=data.files.find(f=>f.name===file);
              if(!entry||!(Number(entry.size)>0)){counts.missing++;continue}
              if(yes(entry.private)){counts.restricted++;continue}
              const url='https://archive.org/download/'+encodeURIComponent(item)+'/'+encodeURIComponent(file);
              let result='unknown';
              try{result=await head(url)}catch{}
              if(result==='pass'){counts.headPass++;continue}
              if(result==='unavailable'){counts.unavailable++;continue}
              for(let attempt=0;attempt<2;attempt++){
                try{result=await rangeProbe(url)}catch{}
                if(result!=='unknown')break;
                if(attempt===0)await new Promise(resolve=>setTimeout(resolve,1500));
              }
              if(result==='pass')counts.rangePass++;
              else if(result==='unavailable')counts.unavailable++;
              else {counts.headUnknown++;unresolved.push(ordinals.get(item+'/'+file));}
            }
          }
          const pending=[...groups];
          await Promise.all(Array.from({length:3},async()=>{while(pending.length)await verify(pending.shift())}));
          console.log('RIGHT01_ARCHIVE_AGGREGATES '+JSON.stringify({...counts,items:groups.size,uniqueFiles:[...groups.values()].reduce((n,x)=>n+x.size,0)}));
          console.log('RIGHT01_UNRESOLVED_FILE_ORDINALS '+JSON.stringify(unresolved.sort((a,b)=>a-b)));
          if(counts.records!==22||counts.invalid||counts.metadataFailures||counts.restricted||counts.missing||counts.unavailable||counts.headUnknown)process.exitCode=1;
          NODE
      - name: Confirm private tracked source is unchanged
        if: always() && steps.pin.outcome == 'success'
        working-directory: source
        run: git diff --exit-code --quiet
