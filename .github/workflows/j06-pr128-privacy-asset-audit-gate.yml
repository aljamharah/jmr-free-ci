name: J06 PR128 privacy asset audit source and static parity
on:
  push:
    branches: [main]
    paths: [".github/workflows/j06-pr128-privacy-asset-audit-gate.yml"]
permissions:
  contents: read
jobs:
  verify:
    if: github.repository == 'aljamharah/jmr-free-ci' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Require existing read-only private contents credential
        env:
          TOKEN: ${{ secrets.JMR_PRIVATE_REPO_READ_TOKEN }}
        run: test -n "$TOKEN" || { echo "::error::Read-only credential unavailable"; exit 1; }
      - name: Checkout fixed baseline
        uses: actions/checkout@v4
        with:
          repository: aljamharah/aljamharah
          ref: 4cd218a2e9062fd5c5df056c8063103d6d790d78
          token: ${{ secrets.JMR_PRIVATE_REPO_READ_TOKEN }}
          persist-credentials: false
          path: before
      - name: Checkout fixed candidate
        uses: actions/checkout@v4
        with:
          repository: aljamharah/aljamharah
          ref: e2ac890d446164e55e29e96ff8bc048aedefdbc3
          token: ${{ secrets.JMR_PRIVATE_REPO_READ_TOKEN }}
          persist-credentials: false
          path: after
      - name: Assert pinning
        run: |
          test "$(git -C before rev-parse HEAD)" = "4cd218a2e9062fd5c5df056c8063103d6d790d78"
          test "$(git -C after rev-parse HEAD)" = "e2ac890d446164e55e29e96ff8bc048aedefdbc3"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install free CMS validation helpers
        run: python -m pip install --disable-pip-version-check python-frontmatter pyyaml > /dev/null
      - name: Run privacy asset regression and full site foundation
        working-directory: after
        run: |
          node --test tests/architecture/asset-references.test.mjs > /tmp/j06_privacy_audit_tests.log 2>&1 ||
            { echo "::error::Privacy asset tests failed; private logs withheld"; exit 1; }
          echo "J06_PRIVACY_ASSET_TEST_PASS"
          node scripts/check_site_foundation.mjs > /tmp/j06_private_foundation.log 2>&1 ||
            { echo "::error::Full foundation failed; private logs withheld"; exit 1; }
          echo "J06_FULL_FOUNDATION_PASS"
      - name: Build independent static outputs
        run: |
          (cd before && node scripts/build_public_site.mjs > /tmp/j06_before.log 2>&1) ||
            { echo "::error::Baseline build failed"; exit 1; }
          (cd after && node scripts/build_public_site.mjs > /tmp/j06_after.log 2>&1) ||
            { echo "::error::Candidate build failed"; exit 1; }
      - name: Prove static dist is byte-for-byte unchanged
        working-directory: after
        run: |
          node scripts/validation/compare-public-dist.mjs ../before/build-reports/dist-inventory.json build-reports/dist-inventory.json > /tmp/j06_private_parity.log 2>&1 ||
            { echo "::error::Unexpected public output change"; exit 1; }
          echo "J06_STATIC_DIST_PARITY_PASS"
      - name: Safe summary
        run: |
          git -C before diff --exit-code --quiet
          git -C after diff --exit-code --quiet
          {
            echo '### J06 privacy-asset regression PR #128'
            echo '- Exact SHA source check: PASS'
            echo '- Privacy page missing-asset regression test: PASS'
            echo '- Complete source foundation: PASS'
            echo '- Public static dist path/bytes/SHA256: IDENTICAL'
            echo '- No private data or artifacts printed; no remote writes'
          } >> "$GITHUB_STEP_SUMMARY"
