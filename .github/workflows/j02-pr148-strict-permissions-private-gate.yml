name: J02 PR148 strict book flags and local upload path security
on:
  push:
    branches: [main]
    paths: [".github/workflows/j02-pr148-strict-permissions-private-gate.yml"]
permissions:
  contents: read
jobs:
  verify:
    if: github.repository == 'aljamharah/jmr-free-ci' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Require existing private read-only token
        env:
          TOKEN: ${{ secrets.JMR_PRIVATE_REPO_READ_TOKEN }}
        run: test -n "$TOKEN" || { echo "::error::Existing read-only token unavailable"; exit 1; }
      - name: Checkout pinned baseline source
        uses: actions/checkout@v4
        with:
          repository: aljamharah/aljamharah
          ref: 68db144d4b0fd45d6c1d98fbdd195a3fda4b3807
          token: ${{ secrets.JMR_PRIVATE_REPO_READ_TOKEN }}
          persist-credentials: false
          path: before
      - name: Checkout pinned PR148 head
        uses: actions/checkout@v4
        with:
          repository: aljamharah/aljamharah
          ref: dba90228ff5828bd36cc94b06c5e6aabfe1964cf
          token: ${{ secrets.JMR_PRIVATE_REPO_READ_TOKEN }}
          persist-credentials: false
          path: after
      - name: Assert immutable source SHA identities
        run: |
          test "$(git -C before rev-parse HEAD)" = "68db144d4b0fd45d6c1d98fbdd195a3fda4b3807"
          test "$(git -C after rev-parse HEAD)" = "dba90228ff5828bd36cc94b06c5e6aabfe1964cf"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install required free test helpers
        run: python -m pip install --disable-pip-version-check python-frontmatter pyyaml > /dev/null
      - name: Execute strict permission/path regression on synthetic fixtures
        working-directory: after
        run: |
          python -m unittest discover -s tests -p test_library_permission_flags.py > /tmp/j02_flags_regression.log 2>&1 ||
            { echo "::error::Strict book permission regression failed"; exit 1; }
          echo "J02_STRICT_FLAGS_TEST_PASS"
      - name: Verify all library source generation and private reading guards
        working-directory: after
        run: |
          python -m unittest discover -s tests -p test_library_generated_sync.py > /tmp/j02_library_source_sync.log 2>&1 ||
            { echo "::error::Authoritative Markdown/JSON drift"; exit 1; }
          echo "J02_LIBRARY_SYNC_PASS"
          python scripts/validate_library.py > /tmp/j02_library_validation.log 2>&1 ||
            {
              grep -Eo 'validate_library.py", line [0-9]+' /tmp/j02_library_validation.log |
                sed -E 's/.*line /J02_VALIDATOR_LINE=/' | tail -n 6 || true
              echo "::error::Full reader/rights fixture validation failed; only traceback line numbers emitted"; exit 1;
            }
          echo "J02_LIBRARY_RIGHTS_PASS"
      - name: Complete source and integration checks
        working-directory: after
        run: |
          node scripts/check_site_foundation.mjs > /tmp/j02_foundation.log 2>&1 ||
            { echo "::error::Full foundation failed; details withheld from public runner"; exit 1; }
          echo "J02_FOUNDATION_PASS"
      - name: Build pinned public trees independently
        run: |
          (cd before && node scripts/build_public_site.mjs > /tmp/j02_before_build.log 2>&1) ||
            { echo "::error::Baseline public build failed"; exit 1; }
          (cd after && node scripts/build_public_site.mjs > /tmp/j02_after_build.log 2>&1) ||
            { echo "::error::Candidate public build failed"; exit 1; }
      - name: Prove unchanged public dist filenames and hashes
        working-directory: after
        run: |
          node scripts/validation/compare-public-dist.mjs ../before/build-reports/dist-inventory.json build-reports/dist-inventory.json > /tmp/j02_hash_comparison.log 2>&1 ||
            { echo "::error::Unexpected public asset or content change"; exit 1; }
          echo "J02_PUBLIC_DIST_PARITY_PASS"
      - name: Publish safe non-sensitive summary
        run: |
          git -C before diff --exit-code --quiet
          git -C after diff --exit-code --quiet
          {
            echo '### PR148 fail-closed library permission source gate'
            echo '- Immutable private source SHAs verified; token never printed'
            echo '- Quoted false, malformed paths, valid true permissions: PASS'
            echo '- Markdown/JSON generation synchronization: PASS'
            echo '- All book reader and private delivery guards: PASS'
            echo '- Complete JMR/site source tests: PASS'
            echo '- Public dist: exactly identical before and after'
            echo '- No external service writes, API calls, book text output, or artifacts'
          } >> "$GITHUB_STEP_SUMMARY"
