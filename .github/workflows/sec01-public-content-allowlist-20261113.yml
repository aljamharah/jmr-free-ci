name: SEC01 public content JSON allowlist exact revision and dist parity

on:
  push:
    branches:
      - ci/sec01-public-json-allowlist-20261113

permissions:
  contents: read

jobs:
  validate:
    if: github.repository == 'aljamharah/jmr-free-ci' && github.actor == 'aljamharah'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout pinned baseline using read-only credential
        uses: actions/checkout@v4
        with:
          repository: aljamharah/aljamharah
          ref: aad574cfa0e399f6aeffdd4c8b8cea2648652269
          token: ${{ secrets.JMR_PRIVATE_REPO_READ_TOKEN }}
          persist-credentials: false
          path: before

      - name: Checkout pinned candidate using read-only credential
        uses: actions/checkout@v4
        with:
          repository: aljamharah/aljamharah
          ref: 92986a608ef45785f16674357a7007aee5521728
          token: ${{ secrets.JMR_PRIVATE_REPO_READ_TOKEN }}
          persist-credentials: false
          path: after

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Pin repository revisions
        run: |
          test "$(git -C before rev-parse HEAD)" = "aad574cfa0e399f6aeffdd4c8b8cea2648652269"
          test "$(git -C after rev-parse HEAD)" = "92986a608ef45785f16674357a7007aee5521728"

      - name: Run baseline build locally without publishing
        working-directory: before
        run: node scripts/build_public_site.mjs

      - name: Run complete candidate foundation and security regression
        working-directory: after
        run: |
          node scripts/check_site_foundation.mjs
          node --test tests/public-content-export-policy.test.mjs

      - name: Assert strict static dist byte and path parity
        run: |
          node after/scripts/validation/compare-public-dist.mjs before/build-reports/dist-inventory.json after/build-reports/dist-inventory.json

      - name: Assert both checked-out Git worktrees unchanged
        run: |
          test -z "$(git -C before status --porcelain --untracked-files=no)"
          test -z "$(git -C after status --porcelain --untracked-files=no)"

      - name: GET-only exact Cloudflare Preview security and public content smoke
        run: |
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          const origins=[
            "https://7561f2c7.aljamharah.pages.dev",
            "https://582a0577.aljamharah-staging.pages.dev"
          ];
          async function fetchSameOrigin(origin,path){
            let url=new URL(path,origin);
            for(let hop=0;hop<4;hop++){
              const r=await fetch(url,{method:"GET",redirect:"manual",signal:AbortSignal.timeout(20000)});
              if([301,302,307,308].includes(r.status)){
                const location=r.headers.get("location");
                assert.ok(location,"Redirect without Location");
                const next=new URL(location,url);
                assert.equal(next.origin,new URL(origin).origin,"Unexpected off-origin redirect");
                url=next;continue;
              }
              const raw=await r.text();
              assert.ok(raw.length<=3000000,"Unexpected oversized response");
              return {status:r.status,mime:(r.headers.get("content-type")||"").split(";")[0],raw};
            }
            throw Error("Excessive redirects");
          }
          for(const origin of origins){
            const home=await fetchSameOrigin(origin,"/");
            assert.equal(home.status,200,"Missing public home");
            const evaluation=await fetchSameOrigin(origin,"/content/jmr/knowledge/evaluations.json");
            const safe=([403,404].includes(evaluation.status)) ||
              (evaluation.status===200 && evaluation.mime==="text/html" && evaluation.raw===home.raw);
            assert.equal(safe,true,"Internal JMR evaluation data exposed in deployed Preview");
            const knowledge=await fetchSameOrigin(origin,"/content/jmr/knowledge/index.json");
            assert.equal(knowledge.status,200,"Public knowledge index missing");
            const json=JSON.parse(knowledge.raw);
            assert.ok(json && typeof json==="object","Public knowledge payload invalid");
            const books=await fetchSameOrigin(origin,"/content/books/index.json");
            assert.equal(books.status,200,"Books index missing");
            const listed=JSON.parse(books.raw);
            assert.ok(Array.isArray(listed.books),"Books index shape invalid");
            console.log("SEC01_ALLOWLIST_PREVIEW_GET=PASS project="+new URL(origin).hostname.split(".").slice(-3).join("."));
          }
          NODE
