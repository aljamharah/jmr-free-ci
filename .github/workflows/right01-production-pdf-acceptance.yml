name: RIGHT-01 final production PDF acceptance
on:
  push:
    branches: [main]
    paths: [".github/workflows/right01-production-pdf-acceptance.yml"]
permissions:
  contents: read
concurrency:
  group: right01-production-pdf-acceptance
  cancel-in-progress: false
jobs:
  persistent-sources:
    if: github.repository == 'aljamharah/jmr-free-ci' && github.ref == 'refs/heads/main' && github.actor == 'aljamharah'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Probe only three persistently inconclusive PDF files
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const base='https://aljamharah.pages.dev';
          const allowed=u=>u.protocol==='https:'&&!u.username&&!u.password&&(u.origin===base||u.hostname==='archive.org'||u.hostname.endsWith('.archive.org'));
          async function json(url){const r=await fetch(url,{signal:AbortSignal.timeout(15000)});assert.ok(r.ok);return r.json()}
          const specs=[['abdulaziz-atiq-arud-qafiya','32568.pdf',1],['jurjani-asrar-al-balagha-archive','0157.pdf',46],['jurjani-asrar-al-balagha-archive','0157p.pdf',47]];
          async function probe(url){
            try{
              for(let i=0;i<5;i++){
                const u=new URL(url);if(!allowed(u))return 'blocked-origin';
                const r=await fetch(u,{redirect:'manual',headers:{Range:'bytes=0-1023',Accept:'application/pdf','Accept-Encoding':'identity'},signal:AbortSignal.timeout(15000)});
                if(r.status>=300&&r.status<400&&r.headers.get('location')){
                  if(r.body)await r.body.cancel().catch(()=>{});
                  url=new URL(r.headers.get('location'),u).href;continue;
                }
                if(![200,206].includes(r.status)){if(r.body)await r.body.cancel().catch(()=>{});return 'http-'+r.status}
                if(!r.body)return 'no-body';
                const reader=r.body.getReader();let first='';
                try{
                  while(first.length<1024){const {done,value}=await reader.read();if(done)break;first+=new TextDecoder().decode(value.subarray(0,1024-first.length));if(first.includes('%PDF-'))return 'pdf-signature'}
                  return 'no-signature';
                }finally{await reader.cancel().catch(()=>{})}
              }
              return 'redirect-limit';
            }catch{return 'network-inconclusive'}
          }
          const results=await Promise.all(specs.map(async([id,file,ordinal])=>{
            try{
              const b=await json(base+'/content/books/records/'+id+'.json');
              const item=new URL(b.archive_item_url).pathname.split('/').pop();
              const source='https://archive.org/download/'+encodeURIComponent(item)+'/'+encodeURIComponent(file);
              const listed=[b.archive_pdf_source_url,b.archive_cover_pdf_source_url,...(b.archive_pdf_files||[]).map(x=>x.url)];
              assert.ok(listed.includes(source));
              const meta=await json('https://archive.org/metadata/'+encodeURIComponent(item));
              const truth=x=>[true,1,'1','true'].includes(x);
              const f=meta.files.find(x=>x.name===file);
              if(!f||!Number(f.size)||truth(f.private)||truth(meta.is_dark)||truth(meta.metadata?.['access-restricted-item']))return {ordinal,source:'missing-or-restricted',relay:'not-attempted'};
              let direct=await probe(source);
              // Only use official public storage mirrors after transient network failure, never after denial.
              if(['network-inconclusive','redirect-limit','http-429','http-500','http-502','http-503','http-504'].includes(direct)){
                for(const host of [meta.d1,meta.d2]){
                  if(typeof host!=='string'||!/^[-a-z0-9.]+\.archive\.org$/.test(host)||typeof meta.dir!=='string'||!/^\/[0-9]+\/items\/[A-Za-z0-9._-]+$/.test(meta.dir))continue;
                  if(meta.dir.split('/').pop()!==item)continue;
                  direct=await probe('https://'+host+meta.dir+'/'+encodeURIComponent(file));
                  if(direct==='pdf-signature'||['http-401','http-403','http-451','http-404','http-410'].includes(direct))break;
                }
              }
              const denied=['http-401','http-403','http-451','http-404','http-410'].includes(direct);
              const relay=denied?'not-attempted':await probe(base+'/api/books/pdf/'+id+'?file='+encodeURIComponent(file));
              return {ordinal,source:direct,relay};
            }catch{return {ordinal,source:'setup-inconclusive',relay:'not-attempted'}}
          }));
          console.log('RIGHT01_PERSISTENT_PDF '+JSON.stringify(results));
          if(results.some(r=>r.source!=='pdf-signature'||r.relay!=='pdf-signature'))process.exitCode=1;
          NODE
  pdf-browser:
    if: github.repository == 'aljamharah/jmr-free-ci' && github.ref == 'refs/heads/main' && github.actor == 'aljamharah'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0,1,2,3]
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install disposable browser
        run: |
          mkdir -p "$RUNNER_TEMP/right01-final"
          cd "$RUNNER_TEMP/right01-final"
          npm install --no-audit --no-fund --no-save --package-lock=false playwright@1.56.1 >/dev/null
          if ! command -v google-chrome >/dev/null 2>&1; then npx playwright install chromium >/dev/null; fi
      - name: Exercise actual production PDF rendering and next/previous controls
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/right01-final"
          cat > audit.mjs <<'NODE'
          import {chromium} from 'playwright';
          import assert from 'node:assert/strict';
          const base='https://aljamharah.pages.dev',shard=Number(process.env.SHARD);
          const read=async path=>{const r=await fetch(base+path,{signal:AbortSignal.timeout(15000)});assert.ok(r.ok);return r};
          const viewer=await (await read('/book-pdf-viewer.html')).text();
          assert.ok(viewer.includes('fallback-retry')&&viewer.includes('PDF_OPEN_TIMEOUT_MS=25000'),'deployed PDF release marker absent');
          const index=await (await read('/content/books/index.json')).json();
          assert.equal(index.books.length,22);
          const jobs=[];
          for(let i=0;i<index.books.length;i++)for(const width of [390,1280])jobs.push({entry:index.books[i],ordinal:i+1,width});
          const results=[];
          let browser;
          try{browser=await chromium.launch({channel:'chrome',headless:true})}
          catch{browser=await chromium.launch({headless:true})}
          async function fingerprint(frame){
            return frame.evaluate(()=>{
              const c=document.getElementById('paper'),s=document.createElement('canvas');
              s.width=s.height=96;const ctx=s.getContext('2d');ctx.drawImage(c,0,0,96,96);
              const d=ctx.getImageData(0,0,96,96).data;let h=2166136261,ink=0;
              for(let i=0;i<d.length;i+=4){h=Math.imul(h^(d[i]+d[i+1]*256+d[i+2]*65536),16777619);if(Math.min(d[i],d[i+1],d[i+2])<235)ink++}
              return {hash:h>>>0,ink};
            });
          }
          async function ready(frame,n,timeout){
            await frame.waitForFunction(n=>{
              const el=id=>document.getElementById(id);
              return el('reader-toolbar')&&!el('reader-toolbar').hidden&&!el('viewport').hidden&&!el('fallback').classList.contains('show')&&el('status').textContent.trim()===''&&Number(el('total').textContent)>=2&&Number(el('page').value)===n&&el('paper').width>100&&el('paper').height>100;
            },n,{timeout});
          }
          async function run(job){
            const {entry,ordinal,width}=job;
            const result={ordinal,width,category:'setup'};
            let ctx,client,bytes=0,relayRequests=0,budget=false,relaySuccess=0;
            try{
              assert.match(entry.id,/^[a-z0-9-]+$/);
              ctx=await browser.newContext({viewport:{width,height:844},locale:'ar',serviceWorkers:'block'});
              const page=await ctx.newPage();
              client=await ctx.newCDPSession(page);await client.send('Network.enable');
              client.on('Network.dataReceived',e=>{
                bytes+=Math.max(0,e.dataLength||0);
                if(bytes>12*1024*1024&&!budget){budget=true;void ctx.close().catch(()=>{})}
              });
              await ctx.route('**/*',route=>{
                const req=route.request(),u=new URL(req.url());
                if(budget||!['GET','HEAD'].includes(req.method()))return route.abort();
                if(u.origin===base){
                  if(u.pathname.startsWith('/api/')){
                    if(u.pathname!=='/api/books/pdf/'+entry.id||++relayRequests>64)return route.abort();
                  }
                  return route.continue();
                }
                if(u.origin==='https://cdnjs.cloudflare.com'&&u.pathname.startsWith('/ajax/libs/pdf.js/4.10.38/'))return route.continue();
                return route.abort();
              });
              page.on('response',r=>{if(r.url().startsWith(base+'/api/books/pdf/'+entry.id+'?')&&[200,206].includes(r.status()))relaySuccess++});
              await page.goto(base+'/book.html?id='+encodeURIComponent(entry.id),{waitUntil:'domcontentloaded',timeout:15000});
              await page.getByRole('button',{name:'قارئ PDF',exact:true}).click({timeout:12000});
              const iframe=page.locator('#bookReading .waqf-reader-frame');
              const handle=await iframe.elementHandle({timeout:10000});const frame=await handle.contentFrame();
              if(!frame)throw Error('frame');
              await frame.waitForURL(/\/book-pdf-viewer(?:\.html)?\?/, {timeout:10000});
              result.category='open';
              await ready(frame,1,32000);
              const first=await fingerprint(frame);
              result.category='next';
              await frame.locator('#next').click({timeout:4000});
              await ready(frame,2,15000);
              const second=await fingerprint(frame);
              assert.ok(first.hash!==second.hash&&first.ink+second.ink>0);
              result.category='previous';
              await frame.locator('#previous').click({timeout:4000});
              await ready(frame,1,15000);
              assert.equal((await fingerprint(frame)).hash,first.hash);
              assert.ok(relaySuccess>0);
              result.category='pass';
            }catch{if(budget)result.category='network-budget';else if(relayRequests>64)result.category='request-budget'}
            finally{if(ctx)await ctx.close().catch(()=>{})}
            result.relayResponses=relaySuccess;results.push(result);
            console.log('RIGHT01_PDF_CASE '+JSON.stringify(result));
          }
          try{for(let i=shard;i<jobs.length;i+=4)await run(jobs[i])}
          finally{await browser.close()}
          console.log('RIGHT01_PDF_BROWSER '+JSON.stringify({shard,attempts:results.length,passed:results.filter(r=>r.category==='pass').length,results}));
          if(results.some(r=>r.category!=='pass'))process.exitCode=1;
          NODE
          node audit.mjs
