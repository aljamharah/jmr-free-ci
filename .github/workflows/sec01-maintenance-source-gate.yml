name: Read-only SEC01 and maintenance pinned-source validation

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/sec01-maintenance-source-gate.yml"

permissions:
  contents: read

concurrency:
  group: sec01-maintenance-pinned-source-2026-11-13
  cancel-in-progress: false

jobs:
  validate:
    if: github.repository == 'aljamharah/jmr-free-ci' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Require existing read-only private source credential
        env:
          READ_TOKEN: ${{ secrets.JMR_PRIVATE_REPO_READ_TOKEN }}
        run: |
          if [ -z "$READ_TOKEN" ]; then
            echo "::error::Missing private source Contents:Read token"
            exit 1
          fi

      - name: Checkout reviewed PR86 security candidate (read only)
        uses: actions/checkout@v4
        with:
          repository: aljamharah/aljamharah
          ref: 5bd6693778a73d294b4a0ce58c6b581c560d5440
          token: ${{ secrets.JMR_PRIVATE_REPO_READ_TOKEN }}
          persist-credentials: false
          path: security

      - name: Checkout reviewed PR87 maintenance candidate (read only)
        uses: actions/checkout@v4
        with:
          repository: aljamharah/aljamharah
          ref: 30066f0e41b8bfa8370bf2b7e7aaa8f3ccaf7b9a
          token: ${{ secrets.JMR_PRIVATE_REPO_READ_TOKEN }}
          persist-credentials: false
          path: maintenance

      - name: Verify exact pinned private commit IDs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C security rev-parse HEAD)" = "5bd6693778a73d294b4a0ce58c6b581c560d5440"
          test "$(git -C maintenance rev-parse HEAD)" = "30066f0e41b8bfa8370bf2b7e7aaa8f3ccaf7b9a"
          echo "Both reviewed revisions pinned. No source content printed."

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install free open-source validation dependencies
        run: python -m pip install --disable-pip-version-check python-frontmatter pyyaml

      - name: Verify updated PR86 source syntax (GET only)
        working-directory: security
        run: node --check scripts/security/audit-pages-deployments.mjs

      - name: Test PR86 read-only security audit without Cloudflare credentials
        working-directory: security
        run: node --test tests/sec01-readonly-deployments.test.mjs

      - name: Test PR86 full foundation regression
        working-directory: security
        run: node scripts/check_site_foundation.mjs

      - name: Test PR87 full foundation regression
        working-directory: maintenance
        run: node scripts/check_site_foundation.mjs

      - name: Verify PR87 has no dead font URL and privacy text stays explicitly a draft
        working-directory: maintenance
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import assert from 'node:assert/strict';
          const poem = readFileSync('poem.html','utf8');
          const settings = JSON.parse(readFileSync('content/settings/site.json','utf8'));
          assert.ok(!poem.includes('src:url("assets/sultani-hadith.woff2")'));
          assert.ok(poem.includes('"SultaniHadith","Amiri",serif'));
          assert.ok(settings.privacy_policy.startsWith('مسودة سياسة الخصوصية'));
          assert.ok(settings.privacy_policy.includes('غير معتمدة'));
          console.log('Missing font request removed; approved fallback retained; CMS policy remains explicitly unapproved.');
          NODE

      - name: Confirm tracked source files are unchanged after every test
        shell: bash
        run: |
          set -euo pipefail
          git -C security diff --exit-code
          git -C maintenance diff --exit-code
          echo "Read-only tests complete; no Cloudflare writes, deployments, deletions, token disclosure, or AI calls."
