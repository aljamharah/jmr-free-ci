name: Five classics reconciled 1563 harakat pinned independent CI
on:
  push:
    branches: [audit/poetry-secondary-verified-20261118]
permissions: {contents: read}
jobs:
  verify:
    if: github.repository == 'aljamharah/jmr-free-ci'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          repository: aljamharah/aljamharah
          ref: 7f84d352806ab1802a6f26b59d59ca7e30cde2c6
          token: ${{ secrets.JMR_PRIVATE_REPO_READ_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate pinned source
        run: test "$(git rev-parse HEAD)" = "7f84d352806ab1802a6f26b59d59ca7e30cde2c6"
      - name: Install validation tools
        run: python -m pip install --disable-pip-version-check python-frontmatter pyyaml
      - name: Verify additional source-confirmed harakat and all previous poem agreements
        run: node --test tests/editorial/classics-additional-sourced-harakat.test.mjs tests/editorial/classics-source-vocalization.test.mjs tests/editorial/poetry-source-collation-harakat.test.mjs tests/editorial/poems-completeness-regression.test.mjs tests/editorial/maari-batch01-index.test.mjs
      - name: Site privacy and foundation
        run: |
          python scripts/validate_library.py
          node scripts/check_site_foundation.mjs
      - name: Full suite
        run: npm test
      - name: Safe build
        run: node scripts/build_public_site.mjs
      - name: Ensure no source mutation
        run: git diff --exit-code -- content/poems.json poem.html
