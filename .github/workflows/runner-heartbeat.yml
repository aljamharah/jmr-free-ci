name: Validate SQLite rate-limit Durable Object in local Workerd
on:
  push:
    branches:
      - diagnostics/actions-runner-availability-2026-11-11
  workflow_dispatch:
permissions:
  contents: read
jobs:
  do:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: "Checkout private DO module read only"
        uses: actions/checkout@v4
        with:
          repository: aljamharah/aljamharah
          ref: main
          token: ${{ secrets.JMR_PRIVATE_REPO_READ_TOKEN }}
          path: source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: "Install Workerd Vitest dependencies with peer conflict compatibility"
        working-directory: source/workers/jmr-ratelimit-do
        run: |
          node --version
          npm --version
          npm install --legacy-peer-deps --no-audit --no-fund --no-save --package-lock=false
      - name: "Test atomic rate limiting and SQLite alarms"
        working-directory: source/workers/jmr-ratelimit-do
        run: npm test
      - name: "Ensure tracked source is unchanged"
        working-directory: source
        run: git diff --exit-code -- .
