name: Verify live Jamharah production and JMR on free infrastructure
on:
  push:
    branches:
      - diagnostics/actions-runner-availability-2026-11-11
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: "Verify live Pages build, privacy and JMR API"
        run: |
          node --input-type=module <<'NODE'
          const origin="https://aljamharah.pages.dev";
          const endpoints=[
            ["index.html",["lexicon.html?q=","type=\"button\""]],
            ["catalog.html",["lexicon.html#wordSearch","type=\"button\""]],
            ["lexicon.html",["new URLSearchParams(window.location.search).get(\"q\")"]],
            ["library.html",["booksLoadFailure","تعذّر تحميل بيانات المكتبة حالياً"]],
            ["book.html",["rel=\"stylesheet\"><style>"]],
            ["reader.html",["rel=\"stylesheet\"><style>"]],
            ["poets.html",["id=\"searchButton\""]],
            ["poet.html",["id=\"searchButton\""]],
            ["poem.html",["id=\"searchButton\""]],
            ["jmr.html",["![\"curated_reference\", \"poet_biography_reference\", \"quran_corpus\"].includes","id=\"sendButton\""]]
          ];
          const results=[];
          async function get(path){
            const response=await fetch(origin+path,{
              redirect:"follow",signal:AbortSignal.timeout(20000),headers:{"Cache-Control":"no-cache"}
            });
            return {status:response.status,body:await response.text(),headers:response.headers};
          }
          for(const [path,markers] of endpoints){
            try{
              const result=await get("/"+path);
              const matched=markers.filter(x=>result.body.includes(x)).length;
              const ok=result.status===200&&matched===markers.length;
              console.log("HTML "+path+" status="+result.status+" release_markers="+matched+"/"+markers.length+" pass="+ok);
              results.push(ok);
            }catch(error){console.log("HTML "+path+" request_failure="+error.name);results.push(false);}
          }
          let privacy=false;
          for(const path of ["/content/poems%2Ejson","/content/poems.json"]){
            try{
              const result=await get(path);
              let safe=result.status===404||result.status===403;
              let published=0;
              if(result.status===200){
                const data=JSON.parse(result.body);
                published=Array.isArray(data.poems)?data.poems.length:0;
                safe=published>0&&data.poems.every(p=>p.publication_status==="published"&&
                  !["rights_basis","text_attribution","editorial_token","editorial_note"].some(key=>Object.hasOwn(p,key)));
              }
              console.log("PRIVACY "+path+" http="+result.status+" published_count="+published+" sanitized="+safe);
              privacy ||=safe;
              if(!safe)process.exitCode=1;
            }catch(error){console.log("PRIVACY "+path+" failure="+error.name);process.exitCode=1;}
          }
          try{
            const r=await get("/api/jmr");
            console.log("JMR_METHOD GET http="+r.status+" expected=405");
            if(r.status!==405)process.exitCode=1;
          }catch(error){console.log("JMR_METHOD ERROR "+error.name);process.exitCode=1;}
          async function ask(label,message){
            try{
              const response=await fetch(origin+"/api/jmr",{
                method:"POST",redirect:"follow",signal:AbortSignal.timeout(45000),
                headers:{"Content-Type":"application/json","Origin":origin},
                body:JSON.stringify({message,conversation:[]})
              });
              let payload={};try{payload=await response.json();}catch{}
              const reply=typeof payload.answer==="string"?payload.answer:"";
              const ok=response.status===200&&reply.length>=15;
              console.log("JMR_POST "+label+" http="+response.status+" valid_answer="+ok+
                " answer_chars="+reply.length+" mode="+String(payload.mode||"unknown")+
                " search_status="+String(payload.search_status||"unknown")+
                " has_error="+Boolean(payload.error));
              if(!ok)process.exitCode=1;
            }catch(error){console.log("JMR_POST "+label+" failure="+error.name);process.exitCode=1;}
          }
          // Two bounded requests total; second is a real generative question
          // using the pre-existing Workers AI binding. No paid service setup,
          // external research, payment method or secrets are used.
          await ask("greeting","مرحبا");
          await ask("single_short_generation","ما الفرق بين التشبيه والاستعارة في جملة عربية واحدة؟");
          const passed=results.filter(Boolean).length;
          console.log("RELEASE_SUMMARY html="+passed+"/"+results.length+
            " privacy="+privacy+" tests_pass="+(process.exitCode!==1));
          if(passed!==results.length||!privacy)process.exitCode=1;
          NODE
