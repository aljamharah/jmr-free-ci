name: Validate JMR concise reply fix against full Jamharah regression
on:
  push:
    branches:
      - diagnostics/actions-runner-availability-2026-11-11
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: "Check out private quality branch read-only"
        uses: actions/checkout@v4
        with:
          repository: aljamharah/aljamharah
          ref: quality/jmr-one-sentence-responses-2026-11-11
          token: ${{ secrets.JMR_PRIVATE_REPO_READ_TOKEN }}
          path: source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: "Foundation including JMR tests and sanitized build"
        working-directory: source
        run: node scripts/check_site_foundation.mjs
      - name: "Install headless Chrome runner"
        working-directory: source
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          if ! command -v google-chrome >/dev/null 2>&1; then
            npx playwright install --with-deps chromium
          fi
      - name: "Mobile and desktop interactive browser tests"
        working-directory: source
        run: node scripts/test_browser_navigation.mjs
      - name: "Ensure tests did not edit tracked source"
        working-directory: source
        run: git diff --exit-code -- .
