name: J01 before after on-demand lexicon browser comparison on pinned private sources
on:
  push:
    branches: [main]
    paths: [".github/workflows/j01-before-after-lexicon-browser-20261117.yml"]
permissions:
  contents: read
jobs:
  compare:
    if: github.repository == 'aljamharah/jmr-free-ci'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Require private contents read-only access
        env:
          TOKEN: ${{ secrets.JMR_PRIVATE_REPO_READ_TOKEN }}
        run: test -n "$TOKEN" || { echo "::error::No existing read-only token"; exit 1; }
      - name: Checkout pre-fix baseline at exact SHA
        uses: actions/checkout@v4
        with:
          repository: aljamharah/aljamharah
          ref: b9e7b9efb5bf6431ba88f14aedc732282beea3cb
          token: ${{ secrets.JMR_PRIVATE_REPO_READ_TOKEN }}
          persist-credentials: false
          path: before
      - name: Checkout post-fix source at exact SHA
        uses: actions/checkout@v4
        with:
          repository: aljamharah/aljamharah
          ref: 394c700a8457e6819b91e684fbcce9dde8b4e84e
          token: ${{ secrets.JMR_PRIVATE_REPO_READ_TOKEN }}
          persist-credentials: false
          path: after
      - name: Validate pinned revisions
        run: |
          test "$(git -C before rev-parse HEAD)" = "b9e7b9efb5bf6431ba88f14aedc732282beea3cb"
          test "$(git -C after rev-parse HEAD)" = "394c700a8457e6819b91e684fbcce9dde8b4e84e"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install temporary browser and build tools
        run: |
          python -m pip install --disable-pip-version-check python-frontmatter pyyaml > /dev/null
          mkdir -p "$RUNNER_TEMP/lexicon-lab"
          cd "$RUNNER_TEMP/lexicon-lab"
          npm install --no-audit --no-fund --no-save --package-lock=false playwright@1.56.1 > /dev/null
          if ! command -v google-chrome >/dev/null 2>&1; then npx playwright install chromium > /dev/null; fi
      - name: Make two private, independent static builds
        run: |
          (cd before && node scripts/build_public_site.mjs > /tmp/j01_before_build.log 2>&1) ||
            { echo "::error::Baseline private build failed; logs withheld"; exit 1; }
          (cd after && node scripts/build_public_site.mjs > /tmp/j01_after_build.log 2>&1) ||
            { echo "::error::Candidate private build failed; logs withheld"; exit 1; }
      - name: Compare same Arabic query results and request counts in localhost browser
        shell: bash
        run: |
          set -euo pipefail
          python -m http.server 8766 --bind 127.0.0.1 --directory before/dist >/tmp/j01_before_server.log 2>&1 &
          P1=$!
          python -m http.server 8767 --bind 127.0.0.1 --directory after/dist >/tmp/j01_after_server.log 2>&1 &
          P2=$!
          trap 'kill "$P1" "$P2" 2>/dev/null || true' EXIT
          cd "$RUNNER_TEMP/lexicon-lab"
          node --input-type=module <<'NODE'
          import {chromium} from 'playwright';
          import assert from 'node:assert/strict';
          import {appendFileSync} from 'node:fs';
          let browser;
          async function survey(port){
            const origin='http://127.0.0.1:'+port;
            const ctx=await browser.newContext({viewport:{width:390,height:844},locale:'ar'});
            await ctx.route('**/*',r=>{
              const req=r.request(),url=new URL(req.url());
              if(url.origin!==origin||req.method()!=='GET')return r.abort();
              return r.continue();
            });
            const page=await ctx.newPage();
            const requests={manifest:0,words:0,original:0};
            page.on('request',r=>{
              const path=new URL(r.url()).pathname;
              if(path.endsWith('/content/jmr/lexicon/manifest.json'))requests.manifest++;
              if(path.endsWith('/content/jmr/lexicon/words_0627.json'))requests.words++;
              if(/\/jamharah_lexicon_[0-9]+\.json$/.test(path))requests.original++;
            });
            const response=await page.goto(origin+'/search.html',{waitUntil:'domcontentloaded',timeout:30000});
            assert.equal(response?.status(),200);
            const results=[];
            for(const query of ['أدب','أخلاق','أسد']){
              await page.locator('#unifiedQuery').fill(query);
              await page.locator('#unifiedForm').evaluate(f=>f.requestSubmit());
              await page.waitForFunction(q=>{
                const s=document.querySelector('#unifiedStatus')?.textContent||'';
                return s.includes('عُثر على')&&s.includes(q);
              },query,{timeout:20000});
              results.push((await page.locator('.unified-result').evaluateAll(nodes=>
                nodes.map(el=>({href:el.getAttribute('href'),title:el.querySelector('strong')?.textContent||''}))
              )).map(x=>x.href+'|'+x.title));
            }
            await ctx.close();
            return {requests,results};
          }
          try{
            try{browser=await chromium.launch({channel:'chrome',headless:true,args:['--no-sandbox']});}
            catch{browser=await chromium.launch({headless:true,args:['--no-sandbox']});}
            const before=await survey(8766),after=await survey(8767);
            assert.deepEqual(after.results,before.results,'Results changed across cache optimization');
            assert.equal(before.requests.original,0);
            assert.equal(after.requests.original,0);
            assert.equal(after.requests.manifest,1,'Candidate manifest not cached');
            assert.equal(after.requests.words,1,'Candidate public prefix shard not cached');
            assert.ok(before.requests.manifest>after.requests.manifest,'Manifest requests not reduced');
            assert.ok(before.requests.words>after.requests.words,'Word requests not reduced');
            console.log('J01_BEFORE_AFTER_PASS manifest_before='+before.requests.manifest+
              ' manifest_after='+after.requests.manifest+' words_before='+before.requests.words+
              ' words_after='+after.requests.words+' results_equal=1 original_source_requests=0');
            appendFileSync(process.env.GITHUB_STEP_SUMMARY,[
              '### J01 measured before/after same-run browser regression',
              '- Private original source checked out read-only at exact before/after SHA',
              '- Two isolated localhost builds; public network blocked and no Cloudflare/AI calls',
              '- Queries: three Arabic words with the same lexicon prefix',
              '- Manifest HTTP request events: before '+before.requests.manifest+' after '+after.requests.manifest,
              '- Word prefix shard HTTP request events: before '+before.requests.words+' after '+after.requests.words,
              '- Rendered result links and titles: identical',
              '- Original lexicon source data shards: 0 HTTP requests',
              '- Lab-only request count, not byte-weighted physical phone performance'
            ].join('\n')+'\n');
          }finally{if(browser)await browser.close();}
          NODE
