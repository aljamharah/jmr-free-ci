name: J07 provisional privacy notice read-only verification
on:
  push:
    branches:
      - ci/j07-privacy-notice-20261113
permissions:
  contents: read

jobs:
  verify:
    if: github.repository == 'aljamharah/jmr-free-ci' && github.actor == 'aljamharah'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact candidate from canonical private repo, read-only
        uses: actions/checkout@v4
        with:
          repository: aljamharah/aljamharah
          ref: 7d94288351654f1aa55333d90eeed182c2abe20b
          token: ${{ secrets.JMR_PRIVATE_REPO_READ_TOKEN }}
          persist-credentials: false
          path: source

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify pinned revision and all source contracts
        working-directory: source
        run: |
          test "$(git rev-parse HEAD)" = "7d94288351654f1aa55333d90eeed182c2abe20b"
          node scripts/check_site_foundation.mjs
          node --test tests/privacy-notice-navigation.test.mjs tests/privacy-disclosure-contract.test.mjs

      - name: Verify sanitized HTML and no private source outputs
        working-directory: source
        run: |
          node scripts/build_public_site.mjs
          test -f dist/privacy.html
          test ! -e dist/.github
          test ! -e dist/scripts
          test ! -e dist/database
          node --input-type=module <<'NODE'
          import {readFileSync} from "node:fs";
          import assert from "node:assert/strict";
          const html=readFileSync("dist/privacy.html","utf8");
          const site=JSON.parse(readFileSync("dist/content/settings/site.json","utf8"));
          assert.ok(html.includes('name="robots" content="noindex,follow"'));
          assert.ok(site.privacy_policy.includes("AlAdhan")&&site.privacy_policy.includes("GPS"));
          console.log("J07_SANITIZED_DIST_SOURCE=PASS");
          NODE

      - name: Install free browser test dependencies
        working-directory: source
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          if ! command -v google-chrome >/dev/null 2>&1; then
            npx playwright install --with-deps chromium
          fi

      - name: Run existing browser regression suite
        working-directory: source
        run: node scripts/test_browser_navigation.mjs

      - name: Test the new public privacy notice in mobile and desktop browsers
        working-directory: source
        run: |
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import {spawn} from "node:child_process";
          import {setTimeout as delay} from "node:timers/promises";
          import {chromium} from "playwright";
          const server=spawn("python3",["-m","http.server","8769","--bind","127.0.0.1","--directory","dist"],{stdio:"ignore"});
          let browser;
          try {
            let ready=false;
            for(let i=0;i<40;i++){
              try {
                const r=await fetch("http://127.0.0.1:8769/privacy.html");
                if(r.status===200){ready=true;break;}
              } catch(_error){}
              await delay(250);
            }
            assert.equal(ready,true,"Sanitized preview failed to start");
            browser=await chromium.launch({channel:"chrome",headless:true,args:["--no-sandbox"]});
            for(const width of [390,1280]){
              const page=await browser.newPage({viewport:{width,height:850}});
              const errors=[];
              page.on("pageerror",e=>errors.push(e.message));
              await page.goto("http://127.0.0.1:8769/privacy.html",{waitUntil:"domcontentloaded"});
              await page.waitForFunction(()=>document.getElementById("privacyStatus")?.textContent?.includes("آخر نسخة متاحة"),null,{timeout:15000});
              const x=await page.evaluate(()=>({
                length:document.getElementById("privacyPolicy")?.textContent?.length||0,
                data:document.getElementById("privacyPolicy")?.textContent||"",
                overflow:document.documentElement.scrollWidth>innerWidth+2,
                links:document.querySelectorAll('a[href="index.html"]').length
              }));
              assert.ok(x.length>2000,"Full CMS policy text was not shown");
              assert.ok(x.data.includes("AlAdhan"));
              assert.equal(x.overflow,false,"Horizontal overflow in privacy page");
              assert.ok(x.links>=1);
              assert.deepEqual(errors,[]);
              console.log("J07_PRIVACY_BROWSER viewport="+width+" success=true");
              await page.close();
            }
          } finally {
            await browser?.close();
            server.kill("SIGTERM");
          }
          NODE

      - name: Verify canonical private source checkout stayed unchanged
        working-directory: source
        run: git diff --exit-code -- .
