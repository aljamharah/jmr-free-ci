name: Free read-only full-poetry red harakat source-safe verification
on:
  push:
    branches: [audit/poetry-harakat-safe-20261118]
permissions:
  contents: read
jobs:
  verify:
    if: github.repository == 'aljamharah/jmr-free-ci'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          repository: aljamharah/aljamharah
          ref: ecdf42f8bbf249ae60fd853a8e4128d6a506ac65
          token: ${{ secrets.JMR_PRIVATE_REPO_READ_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Setup free validations
        run: python -m pip install --disable-pip-version-check python-frontmatter pyyaml
      - name: Confirm source revision
        run: test "$(git rev-parse HEAD)" = 'ecdf42f8bbf249ae60fd853a8e4128d6a506ac65'
      - name: Verify vowelised function words and reading panel red harakat
        run: node --test tests/editorial/poetry-fixed-particles-harakat.test.mjs tests/poem-red-diacritics-no-heading.test.mjs tests/poem-red-diacritics-runtime.test.mjs tests/poem-reading-compact-height.test.mjs
      - name: Re-check full 178 published poem bodies and 91 al-Maarri poems
        run: node --test tests/editorial/poems-completeness-regression.test.mjs tests/editorial/maari-batch01-index.test.mjs
      - name: Validate library, foundation and full technical suite
        run: |
          python scripts/validate_library.py
          node scripts/check_site_foundation.mjs
          npm test
      - name: Verify sanitized site output
        run: node scripts/build_public_site.mjs
      - name: Verify source not modified by tests
        run: git diff --exit-code -- content/poems.json poem.html
