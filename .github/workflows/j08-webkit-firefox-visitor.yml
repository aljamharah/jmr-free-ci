name: J08 WebKit mobile and Firefox desktop public visitor smoke
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/j08-webkit-firefox-visitor.yml"
      - "scripts/j08-webkit-firefox-visitor.mjs"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    if: github.repository == 'aljamharah/jmr-free-ci' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated Playwright WebKit and Firefox
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/j08-xengine"
          cd "$RUNNER_TEMP/j08-xengine"
          npm install --no-audit --no-fund --no-save --package-lock=false playwright@1.56.1 >/dev/null
          npx playwright install --with-deps webkit firefox >/dev/null
      - name: Test public visitor journeys in browser engines
        shell: bash
        run: |
          set -euo pipefail
          cp scripts/j08-webkit-firefox-visitor.mjs "$RUNNER_TEMP/j08-xengine/visitor.mjs"
          cd "$RUNNER_TEMP/j08-xengine"
          node visitor.mjs
