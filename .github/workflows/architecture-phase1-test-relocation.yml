name: Architecture incremental relocation and strict dist parity
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/architecture-phase1-test-relocation.yml"
permissions:
  contents: read
concurrency:
  group: architecture-incremental-single-relocation
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository == 'aljamharah/jmr-free-ci' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Require existing read-only private source token
        env:
          SOURCE_READ_TOKEN: ${{ secrets.JMR_PRIVATE_REPO_READ_TOKEN }}
        run: |
          if [ -z "$SOURCE_READ_TOKEN" ]; then echo "::error::Read-only private checkout token missing"; exit 1; fi
      - name: Checkout exact baseline in isolated folder
        uses: actions/checkout@v4
        with:
          repository: aljamharah/aljamharah
          ref: aad574cfa0e399f6aeffdd4c8b8cea2648652269
          token: ${{ secrets.JMR_PRIVATE_REPO_READ_TOKEN }}
          path: baseline
          persist-credentials: false
      - name: Checkout exact one-file relocation candidate in isolated folder
        uses: actions/checkout@v4
        with:
          repository: aljamharah/aljamharah
          ref: 8f5cf57385b142be5e17d48cf1c9aeac69688440
          token: ${{ secrets.JMR_PRIVATE_REPO_READ_TOKEN }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact one-file security test relocation and unchanged test semantics
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C baseline rev-parse HEAD)" = "aad574cfa0e399f6aeffdd4c8b8cea2648652269"
          test "$(git -C candidate rev-parse HEAD)" = "8f5cf57385b142be5e17d48cf1c9aeac69688440"
          git -C candidate diff --name-status --no-renames aad574cfa0e399f6aeffdd4c8b8cea2648652269 HEAD > /tmp/architecture-relocation-diff.txt
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          import {execFileSync} from 'node:child_process';
          const actual=readFileSync('/tmp/architecture-relocation-diff.txt','utf8').trim().split('\n').sort();
          assert.deepEqual(actual, [
            'A\ttests/security/cloudflare-pages-audit.test.mjs',
            'D\ttests/cloudflare-pages-audit.test.mjs'
          ].sort(), 'Only the security test may move');
          const old=execFileSync('git',['-C','baseline','show','aad574cfa0e399f6aeffdd4c8b8cea2648652269:tests/cloudflare-pages-audit.test.mjs'],{encoding:'utf8'});
          const relocated=readFileSync('candidate/tests/security/cloudflare-pages-audit.test.mjs','utf8');
          const needle='../scripts/audit_cloudflare_pages.mjs';
          assert.equal(old.split(needle).length-1,1);
          assert.equal(relocated,old.replace(needle,'../../scripts/audit_cloudflare_pages.mjs'),
            'Only the relative import path may change');
          console.log('Exact one-test relocation and unchanged semantics verified; no runtime file edits.');
          NODE
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install only local open-source validation dependencies
        run: python -m pip install --disable-pip-version-check python-frontmatter pyyaml
      - name: Run explicit moved-test suite
        working-directory: candidate
        run: node --test tests/security/cloudflare-pages-audit.test.mjs
      - name: Build two independent sanitized static dist trees
        shell: bash
        run: |
          set -euo pipefail
          (cd baseline && node scripts/build_public_site.mjs)
          (cd candidate && node scripts/build_public_site.mjs)
      - name: Compare complete baseline and candidate Node test discovery
        shell: bash
        run: |
          set +e
          (cd baseline && node --test > ../baseline-node.tap 2>&1)
          baseline_status=$?
          (cd candidate && node --test > ../candidate-node.tap 2>&1)
          candidate_status=$?
          set -e
          BASELINE_STATUS="$baseline_status" CANDIDATE_STATUS="$candidate_status" node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          function report(name) {
            const t=readFileSync(name,'utf8');
            const get=(key)=>{const m=t.match(new RegExp('^# '+key+' ([0-9]+)$','m'));return m?Number(m[1]):null;};
            return {tests:get('tests'),pass:get('pass'),fail:get('fail'),cancelled:get('cancelled'),
              failedNames:t.split('\n').filter(line=>line.startsWith('not ok ')).slice(0,10).map(x=>x.slice(0,140))};
          }
          const a=report('baseline-node.tap'),b=report('candidate-node.tap');
          console.log(JSON.stringify({baselineStatus:process.env.BASELINE_STATUS,candidateStatus:process.env.CANDIDATE_STATUS,baseline:a,candidate:b}));
          assert.equal(process.env.BASELINE_STATUS,'0','baseline Node tests failed');
          assert.equal(process.env.CANDIDATE_STATUS,'0','candidate Node tests failed');
          assert.equal(a.tests,a.pass);
          assert.equal(b.tests,b.pass);
          assert.equal(a.tests,b.tests,'Moving the test changed Node test coverage');
          NODE
      - name: Run full technical foundation regression
        working-directory: candidate
        run: node scripts/check_site_foundation.mjs
      - name: Run Python source validators without publishing
        working-directory: candidate
        run: |
          python scripts/validate_library.py
          python -m unittest discover -s tests -p 'test_*.py'
      - name: Require identical public paths bytes and SHA256
        working-directory: candidate
        run: |
          node scripts/validation/compare-public-dist.mjs \
            ../baseline/build-reports/dist-inventory.json \
            build-reports/dist-inventory.json
      - name: Require no tracked source modification
        shell: bash
        run: |
          git -C baseline diff --exit-code
          git -C candidate diff --exit-code
          echo 'Source clean. No Git push, Cloudflare write, model request, or public artifact upload.'
