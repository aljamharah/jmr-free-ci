name: TEST-01 production reader browser matrix
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/test01-production-reader-matrix.yml']
permissions:
  contents: read
jobs:
  reader:
    if: github.repository == 'aljamharah/jmr-free-ci' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'test/test01-production-reader-20261124'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        device: [desktop, iphone-webkit, android-chromium]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser tooling
        run: |
          mkdir -p "$RUNNER_TEMP/reader-audit"
          cd "$RUNNER_TEMP/reader-audit"
          npm install --no-audit --no-fund --no-save --package-lock=false playwright@1.56.1
          if [ "${{ matrix.device }}" = iphone-webkit ]; then
            npx playwright install --with-deps webkit
          else
            npx playwright install --with-deps chromium
          fi
      - name: Check live public reader, selected volumes and pagination
        env:
          DEVICE: ${{ matrix.device }}
        run: |
          cd "$RUNNER_TEMP/reader-audit"
          cat > audit.mjs <<'JS'
          import { chromium, webkit, devices } from 'playwright';
          import assert from 'node:assert/strict';
          import { appendFileSync } from 'node:fs';
          const BASE='https://aljamharah.pages.dev';
          const mode=process.env.DEVICE;
          const result={device:mode,records:0,archive_route:0,archive_images:0,archive_turn:0,volume_switch:0,pdf_render:0,pdf_turn:0,pdf_zoom:0,failures:[]};
          async function json(path){
            const u=new URL(path,BASE);
            assert.equal(u.origin,BASE);
            const r=await fetch(u,{redirect:'error',signal:AbortSignal.timeout(15000)});
            assert.equal(r.status,200);
            return r.json();
          }
          const index=await json('/content/books/index.json');
          assert.ok(index.books.length>0&&index.books.length<=50);
          const books=[];
          for(const row of index.books){
            assert.match(row.record,/^content\/books\/records\/[A-Za-z0-9_-]{1,80}\.json$/);
            const book=await json('/'+row.record);
            assert.equal(book.id,row.id);
            assert.match(book.id,/^[A-Za-z0-9_-]{1,80}$/);
            books.push(book);
          }
          result.records=books.length;
          const engine=mode==='iphone-webkit'?webkit:chromium;
          const browser=await engine.launch({headless:true});
          const ctx=await browser.newContext({
            ...(mode==='iphone-webkit'?devices['iPhone 13']:mode==='android-chromium'?devices['Pixel 7']:{viewport:{width:1280,height:900}}),
            locale:'ar',serviceWorkers:'block',acceptDownloads:false
          });
          await ctx.route('**/*',route=>{
            const req=route.request(),u=new URL(req.url());
            if(!['GET','HEAD'].includes(req.method())||u.protocol!=='https:')return route.abort();
            const allowed=(u.origin===BASE&&!/^\/api\/(?!books\/pdf\/)/.test(u.pathname))||
              u.hostname==='archive.org'||u.hostname.endsWith('.archive.org')||
              (u.hostname==='cdnjs.cloudflare.com'&&u.pathname.startsWith('/ajax/libs/pdf.js/4.10.38/'));
            return allowed?route.continue():route.abort();
          });
          const page=await ctx.newPage();
          const fail=(i,stage)=>result.failures.push({row:i+1,stage});
          const embed=(src)=>{
            const u=new URL(src);
            assert.equal(u.origin,'https://archive.org');
            const p=u.pathname.split('/');
            assert.equal(p[1],'download');
            assert.ok(p.length===4&&decodeURIComponent(p[3]).toLowerCase().endsWith('.pdf'));
            return '/embed/'+p[2]+'/'+encodeURIComponent(decodeURIComponent(p[3]).slice(0,-4));
          };
          const imageSignature=()=>Array.from(document.querySelectorAll('.BRpageimage, .BRpagecontainer img, .BRpageview img')).filter(x=>{
            const r=x.getBoundingClientRect();return x.naturalWidth>50&&r.width>20&&r.height>20&&r.bottom>0&&r.top<innerHeight&&r.right>0&&r.left<innerWidth;
          }).map(x=>x.currentSrc||x.src).sort().join('|');
          const imageReady=()=>Array.from(document.querySelectorAll('.BRpageimage, .BRpagecontainer img, .BRpageview img')).some(x=>{
            const r=x.getBoundingClientRect();return x.naturalWidth>50&&r.width>20&&r.height>20&&r.bottom>0&&r.top<innerHeight&&r.right>0&&r.left<innerWidth;
          });
          const sample=new Set([0,Math.floor(books.length/2),books.length-1]);
          for(const [i,book] of books.entries()){
            let stage='book_navigation';
            try{
              const response=await page.goto(BASE+'/book.html?id='+encodeURIComponent(book.id),{waitUntil:'domcontentloaded',timeout:25000});
              assert.equal(response?.status(),200);
              await page.locator('#bookPanel h1.book-title').waitFor({state:'visible',timeout:12000});
              stage='archive_exact_subfile';
              const f=page.locator('#bookPanel .waqf-reader-frame').first();
              await f.waitFor({state:'visible',timeout:10000});
              const src=await f.getAttribute('src');
              assert.ok(book.archive_pdf_source_url);
              assert.equal(new URL(src).pathname,embed(book.archive_pdf_source_url));
              assert.equal(await page.getByRole('button',{name:'قارئ الأرشيف',exact:true}).getAttribute('aria-pressed'),'true');
              result.archive_route++;
              stage='archive_actual_images';
              const frame=await (await f.elementHandle()).contentFrame();
              assert.ok(frame);
              await frame.waitForFunction(imageReady,null,{timeout:18000});
              result.archive_images++;
              stage='archive_actual_turn';
              const before=await frame.evaluate(imageSignature);
              const next=frame.locator('.BRnavCntlNxt, .BRicon.right, button[title="Next page"], button[aria-label="Next page"], button[title="Next"], button[aria-label="Next"]').filter({visible:true}).first();
              await next.click({timeout:5000});
              await frame.waitForFunction(old=>{
                const now=Array.from(document.querySelectorAll('.BRpageimage, .BRpagecontainer img, .BRpageview img')).filter(x=>{
                  const r=x.getBoundingClientRect();return x.naturalWidth>50&&r.width>20&&r.height>20&&r.bottom>0&&r.top<innerHeight&&r.right>0&&r.left<innerWidth;
                }).map(x=>x.currentSrc||x.src).sort().join('|');
                return now&&now!==old;
              },before,{timeout:12000});
              result.archive_turn++;
            }catch{fail(i,stage);}
            // Independently test the same-origin PDF reader even if Archive fails.
            try{
              const picker=page.locator('.waqf-volume-picker');
              if(await picker.count()&&await picker.locator('option').count()>1){
                stage='volume_switch';
                const f=page.locator('#bookPanel .waqf-reader-frame').first();
                const initial=await f.getAttribute('src');
                await picker.selectOption({index:1});
                const next=await f.getAttribute('src');
                assert.ok(next&&next!==initial&&new URL(next).pathname.startsWith('/embed/'));
                result.volume_switch++;
              }
              if(!sample.has(i))continue;
              stage='pdf_render';
              await page.getByRole('button',{name:'قارئ PDF',exact:true}).click({timeout:5000});
              const f=page.frameLocator('#bookPanel .waqf-reader-frame');
              await f.locator('#reader-toolbar').waitFor({state:'visible',timeout:30000});
              await f.locator('#viewport').waitFor({state:'visible',timeout:15000});
              const pages=Number(await f.locator('#total').innerText());
              assert.ok(pages>1);
              const canvas=f.locator('#paper');
              await f.locator('#status').waitFor({state:'hidden',timeout:20000});
              assert.ok(await canvas.evaluate(c=>c.width>20&&c.height>20));
              result.pdf_render++;
              stage='pdf_turn';
              const before=await canvas.evaluate(c=>c.toDataURL());
              await f.locator('#next').click({timeout:5000});
              await f.locator('#status').waitFor({state:'hidden',timeout:20000});
              assert.equal(await f.locator('#page').inputValue(),'2');
              assert.notEqual(await canvas.evaluate(c=>c.toDataURL()),before);
              await f.locator('#previous').click({timeout:5000});
              await f.locator('#status').waitFor({state:'hidden',timeout:20000});
              assert.equal(await f.locator('#page').inputValue(),'1');
              result.pdf_turn++;
              stage='pdf_zoom';
              const width=await canvas.evaluate(c=>c.width);
              await f.locator('#zoom-in').click({timeout:5000});
              await f.locator('#status').waitFor({state:'hidden',timeout:20000});
              assert.ok(await canvas.evaluate(c=>c.width)>width);
              result.pdf_zoom++;
            }catch{fail(i,stage);}
          }
          await browser.close();
          const report=JSON.stringify(result);
          console.log('TEST01_READER_MATRIX '+report);
          if(process.env.GITHUB_STEP_SUMMARY)appendFileSync(process.env.GITHUB_STEP_SUMMARY,'### Public reader audit (emulation, not physical devices)\n\x60\x60\x60json\n'+report+'\n\x60\x60\x60\n');
          if(result.failures.length)process.exitCode=1;
          JS
          node audit.mjs
      - name: Existing copy, sharing, print and diacritics regression
        if: always() && matrix.device == 'desktop'
        run: |
          cp scripts/test01-live-content-journeys.mjs "$RUNNER_TEMP/reader-audit/regression.mjs"
          cd "$RUNNER_TEMP/reader-audit"
          node regression.mjs
