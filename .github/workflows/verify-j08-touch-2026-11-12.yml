name: Verify J-08 mobile library touch targets
on:
  push:
    branches: [ci/j08-library-touch-targets-2026-11-12]
permissions:
  contents: read
jobs:
  mobile-library:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          repository: aljamharah/aljamharah
          ref: fix/j08-library-mobile-touch-targets-2026-11-12
          token: ${{ secrets.JMR_PRIVATE_REPO_READ_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test mobile touch targets and J-06 library navigation
        run: node --test tests/j08-library-touch-targets.test.mjs tests/j06-library-book-reader-navigation.test.mjs
      - name: Build sanitized published site
        run: node scripts/build_public_site.mjs
      - name: Verify published library and excluded internals
        run: |
          grep -q 'min-width:44px;height:44px' dist/library.html
          test ! -d dist/database
          test ! -d dist/scripts
          test ! -d dist/tests
