name: Verify Jamharah Production (read-only)
on:
  push:
    branches: [ci/production-verification-2026-11-13]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: jamharah-production-smoke-2026-11-13
  cancel-in-progress: true
jobs:
  live-read-only:
    if: github.actor == 'aljamharah' && github.ref == 'refs/heads/ci/production-verification-2026-11-13'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify public production URLs, rights gates, and JMR API method (GET only)
        env:
          SITE: https://aljamharah.pages.dev
        run: |
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          const origin=process.env.SITE;
          assert.equal(new URL(origin).hostname,"aljamharah.pages.dev");
          let checks=0;
          const seen=[];
          async function get(path,expected=200){
            const response=await fetch(origin+path,{
              method:"GET",
              headers:{"Cache-Control":"no-cache","Accept":"*/*"},
              signal:AbortSignal.timeout(20000),
              redirect:"follow"
            });
            assert.equal(response.status,expected,path+" HTTP "+response.status+" != "+expected);
            checks++;
            seen.push(path+" "+response.status);
            return response;
          }
          for(const path of ["/","/index.html","/catalog.html","/lexicon.html","/library.html",
            "/book.html","/reader.html","/poets.html","/poet.html","/poem.html",
            "/jmr.html","/search.html"]){
             const response=await get(path);
             const html=await response.text();
             assert.match(html,/<html/i,path+" is not HTML");
             assert.ok(html.includes("AFF71118-81CC-48DF-A661-4410C687EC8F.png"),path+" approved official logo missing");
             checks+=2;
          }
          const sitemap=await(await get("/sitemap.xml")).text();
          assert.ok(sitemap.includes("/lexicon.html")&&sitemap.includes("/search.html"));
          assert.ok(!sitemap.includes("/reader.html")&&!sitemap.includes("/book.html"));
          checks+=2;
          const robots=await(await get("/robots.txt")).text();
          for(const restricted of ["/admin/","/api/","/content/books/books/"])
             assert.ok(robots.includes("Disallow: "+restricted),"Missing robots instruction "+restricted);
          checks+=3;
          const css=await(await get("/assets/jmr-fidelity.css")).text();
          assert.ok(css.includes("jmr-reference-top::before{inset-inline:-12px}"),"Final JMR mobile glow correction missing in Production");
          checks++;
          const jmr=await(await get("/jmr.html")).text();
          assert.ok(jmr.includes("assets/jmr-fidelity.css"),"JMR visual identity stylesheet missing");
          assert.ok(!jmr.includes("html{min-height:100%;scroll-behavior:smooth;overflow-x:clip}"),"Global document clip unexpectedly used");
          checks+=2;
          const poems=await(await get("/content/poems.json")).json();
          assert.ok(Array.isArray(poems.poems));
          assert.ok(poems.poems.every(p=>p.publication_status==="published"));
          assert.ok(poems.poems.every(p=>!Object.hasOwn(p,"editorial_token")&&!Object.hasOwn(p,"rights_basis")));
          checks+=3;
          const index=await(await get("/content/books/index.json")).json();
          assert.equal(index.books?.length,9,"Book index must contain nine bibliographic records");
          assert.ok(index.books.every(b=>b.rights_label==="حقوق القراءة قيد المراجعة"));
          checks+=2;
          for(const b of index.books){
            assert.match(b.record,/^content\/books\/records\/[A-Za-z0-9_-]+\.json$/);
            const record=await(await get("/"+b.record)).json();
            assert.equal(record.id,b.id);
            assert.equal(record.rights_status,"pending_review");
            assert.equal(record.rights_basis_verified,false);
            assert.equal(record.reading_allowed,false);
            assert.equal(record.download_allowed,false);
            assert.equal(record.external_embed_allowed,false);
            assert.equal(record.external_embed_url,"");
            assert.equal(record.text_content,"");
            assert.equal(record.pdf_url,"");
            assert.match(record.external_source_url,/^https:\/\//);
            checks+=11;
          }
          const api=await get("/api/jmr",405);
          assert.equal(api.headers.get("x-jmr-revision"),"jmr-retrieval-2026-11-12-dedup-r1","JMR backend revision not the reviewed release");
          assert.equal(api.headers.get("x-jmr-social-release"),"natural-replies-r3");
          checks+=2;
          console.log("PRODUCTION HTTP "+seen.join(", "));
          console.log("PRODUCTION CHECKS "+checks+" PASS; books=9; poem_records="+poems.poems.length+"; paid_ai_calls=0; mutation_calls=0");
          NODE

      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install read-only browser smoke dependency
        run: npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright
      - name: Production Chromium browser smoke (5 viewports, no model calls)
        env:
          SITE: https://aljamharah.pages.dev
        run: |
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import {chromium} from "playwright";
          const origin=process.env.SITE;
          let browser;
          try{browser=await chromium.launch({channel:"chrome",headless:true,args:["--no-sandbox"]})}
          catch{browser=await chromium.launch({headless:true,args:["--no-sandbox"]})}
          let assertions=0,requests=0,heavy=0,modelCalls=0;
          const pages=["/","/lexicon.html","/library.html","/jmr.html","/search.html"];
          try{
            for(const width of [320,360,390,414,1280]){
              const ctx=await browser.newContext({viewport:{width,height:844},locale:"ar",reducedMotion:"reduce"});
              await ctx.route("**/*",route=>{
                const req=route.request();requests++;
                if(req.method()!=="GET"){modelCalls++;return route.abort()}
                if(/jamharah_lexicon_[0-9]+\.json(?:[?#]|$)/.test(req.url())){heavy++;return route.abort()}
                return route.continue()
              });
              for(const path of pages){
                const page=await ctx.newPage();
                const errors=[];
                page.on("pageerror",error=>errors.push(error.message));
                const response=await page.goto(origin+path,{waitUntil:"domcontentloaded",timeout:25000});
                assert.equal(response?.status(),200,path+" status "+width);assertions++;
                assert.ok((await page.title()).length>0,path+" title "+width);assertions++;
                await page.evaluate(()=>document.fonts.ready);
                const excess=await page.evaluate(()=>document.documentElement.scrollWidth-window.innerWidth);
                assert.ok(excess<=2,path+" horizontal overflow "+excess+"px at "+width);assertions++;
                assert.equal(errors.length,0,path+" JavaScript error "+errors.slice(0,2).join(" / "));assertions++;
                if(path==="/jmr.html"){
                  assert.equal(await page.locator("button.specialty").count(),10);assertions++;
                  assert.equal(await page.locator("#sendButton").count(),1);assertions++;
                }
                console.log("LIVE_BROWSER "+width+" "+path+" status=200 excess="+excess+" errors="+errors.length);
                await page.close();
              }
              // Pending-rights book source links may open, but no local book reader.
              const book=await ctx.newPage();
              await book.goto(origin+"/book.html?id=akhfash-qawafi",{waitUntil:"domcontentloaded",timeout:25000});
              await book.locator(".book-title").waitFor({timeout:15000});
              assert.equal(await book.getByRole("link",{name:"القراءة داخل قارئ الجمهرة"}).count(),0);assertions++;
              assert.equal(await book.getByRole("link",{name:/فتح صفحة المصدر الخارجي/}).count(),1);assertions++;
              await book.close();
              const reader=await ctx.newPage();
              await reader.goto(origin+"/reader.html?id=akhfash-qawafi&format=external",{waitUntil:"domcontentloaded",timeout:25000});
              await reader.locator("#readerContent .notice").waitFor({timeout:15000});
              assert.equal(await reader.locator("#readerContent iframe").count(),0);assertions++;
              await reader.close();
              await ctx.close();
            }
            assert.equal(modelCalls,0,"No mutating network request is permitted");
            assert.equal(heavy,0,"An ordinary page view must not fetch massive lexicon JSON shards");
            console.log("PRODUCTION CHROMIUM "+assertions+" assertions passed; viewports=320,360,390,414,1280; pages=5; book_rights=source_only; intercepted_heavy_shards="+heavy+"; model_calls="+modelCalls+"; browser_requests="+requests);
          }finally{await browser.close()}
          NODE
