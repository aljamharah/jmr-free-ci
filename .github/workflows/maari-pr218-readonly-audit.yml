name: Read-only al-Maarri PR218 source validation
on:
  push:
    branches: [audit/maari-pr218-20261118]
permissions:
  contents: read
jobs:
  validate:
    if: github.repository == 'aljamharah/jmr-free-ci'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          repository: aljamharah/aljamharah
          ref: 7357b12660fa37cce13be96fe0cb716290b12427
          token: ${{ secrets.JMR_PRIVATE_REPO_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check python-frontmatter pyyaml
      - name: Exact al-Maarri editorial batch test
        run: node --test tests/editorial/maari-batch01-index.test.mjs
      - name: Library validation and safety
        run: python scripts/validate_library.py
      - name: Site and JMR foundation regression
        run: node scripts/check_site_foundation.mjs
      - name: Full Node test suite
        run: npm test
      - name: Sanitize static public build
        run: node scripts/build_public_site.mjs
      - name: Ensure checkout source remains unmodified
        run: git diff --exit-code -- content/poems.json poem.html tests/editorial/maari-batch01-index.test.mjs
