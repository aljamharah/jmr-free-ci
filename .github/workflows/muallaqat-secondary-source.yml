name: Collate supplementary historical Muallaqat variants
on:
  push:
    branches: [audit/secondary-muallaqat-20261118]
permissions: {contents: read}
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Extract public-domain source variants of three old Arabic poems
        run: |
          python -m pip -q install requests beautifulsoup4
          python - <<'PY'
          import requests,bs4,json,time
          mapping={'imru2':'imru-al-qays','tarafa2':'tarafa','antar2':'antarah'}
          for key,slug in mapping.items():
            url='https://mouallakat.com/poems/'+slug+'/'
            try:
              r=requests.get(url,timeout=22,headers={'User-Agent':'Mozilla/5.0'});r.raise_for_status();r.encoding='utf-8'
              soup=bs4.BeautifulSoup(r.text,'html.parser')
              lines=[]
              for bayt in soup.select('article.verse'):
                parts=bayt.select('div.verse-lines > p')
                if len(parts)!=2:continue
                lines.extend([' '.join(w.get_text(' ',strip=True) for w in p.select('span.word')) for p in parts])
              print('EXTRACT',key,'LINES',len(lines),'FIRST',repr(lines[:2]),flush=True)
              if len(lines)>30 and len(lines)%2==0:
                print('PUBLIC_POEM_JSON',json.dumps({'key':key,'url':r.url,'lines':lines},ensure_ascii=False,separators=(',',':')),flush=True)
            except Exception as e:print('ERROR',key,repr(e)[:200],flush=True)
            time.sleep(.25)
          PY
