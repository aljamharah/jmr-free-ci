name: SEC01 PR91 exact SHA full source gate (read only)

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/sec01-pr91-source-gate.yml"

permissions:
  contents: read

jobs:
  source-gate:
    if: github.repository == 'aljamharah/jmr-free-ci' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout fixed SEC01 source (no persistent token)
        uses: actions/checkout@v4
        with:
          repository: aljamharah/aljamharah
          ref: 05f0217587e84f192188a15441180517b5add5d0
          token: ${{ secrets.JMR_PRIVATE_REPO_READ_TOKEN }}
          persist-credentials: false
          path: source
      - name: Confirm exact reviewed head
        run: |
          test "$(git -C source rev-parse HEAD)" = "05f0217587e84f192188a15441180517b5add5d0"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install free validation-only requirements
        run: python -m pip install --disable-pip-version-check python-frontmatter pyyaml
      - name: Run SEC01 pagination and null alias regression suite
        working-directory: source
        run: node --test tests/sec01-readonly-deployments.test.mjs
      - name: Run all JMR and site foundation regression groups
        working-directory: source
        run: node scripts/check_site_foundation.mjs
      - name: Confirm source tree unchanged by tests
        working-directory: source
        run: |
          git diff --exit-code
          echo "PASS: read-only tests; no Cloudflare API, model calls, deployments, branch writes or deletes."
