name: Identify public poetry couplet wrappers
on:
  push:
    branches: [audit/poetry-voweled-sources-20261118]
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Find correct DCT half-line selectors
        run: |
          python -m pip -q install requests beautifulsoup4
          python - <<'PY'
          import requests,bs4,collections,json
          url='https://poetry.dct.gov.ae/poems/286-على-قدر-أهل-العزم-تأتي-العزائم'
          r=requests.get(url,timeout=25,headers={'User-Agent':'Mozilla/5.0'});r.encoding='utf-8';s=bs4.BeautifulSoup(r.text,'html.parser')
          word=s.select_one('section.poem-body .word-search')
          if word:
            p=word
            for n in range(8):
              if not p:break
              print('PARENT',n,json.dumps({'tag':p.name,'class':p.get('class'),'id':p.get('id'),'text':p.get_text(' ',strip=True)[:220],'html':str(p)[:1100]},ensure_ascii=False),flush=True)
              p=p.parent
          classes=collections.Counter()
          for t in s.select_one('section.poem-body').find_all(True):
            for cls in t.get('class') or []: classes[cls]+=1
          print('CLASSES',classes.most_common(55))
          PY
