name: Gather three additional public historical fully vowelled muallaqat
on:
  push:
    branches: [audit/poetry-voweled-sources-20261118]
permissions: {contents: read}
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Collect public-source verse text without accessing private project
        run: |
          python -m pip -q install requests beautifulsoup4
          python - <<'PY'
          import requests,bs4,json,time
          urls={
            'tarafa':'https://poetry.dct.gov.ae/poems/1954-لخولة-أطلال-ببرقة-ثهمد',
            'zuhair':'https://poetry.dct.gov.ae/poems/1981-أمن-أم-أوفى-دمنة-لم-تكلم',
            'antar':'https://poetry.dct.gov.ae/poems/9850-هل-غادر-الشعراء-من-متردم'
          }
          for key,url in urls.items():
            try:
              r=requests.get(url,timeout=30,headers={'User-Agent':'Mozilla/5.0'});r.raise_for_status()
              r.encoding='utf-8';s=bs4.BeautifulSoup(r.text,'html.parser')
              lines=[]
              for row in s.select('section.poem-body tr.poem-verses'):
                cells=row.select('td.poem-verses__part')
                if len(cells)!=2:continue
                lines.extend([' '.join(w.get_text(' ',strip=True) for w in cell.select('span.word-search')) for cell in cells])
              print('EXTRACT',key,'LINES',len(lines),'FIRST',repr(lines[:2]),'LAST',repr(lines[-2:]),flush=True)
              if len(lines)>20 and len(lines)%2==0:
                print('PUBLIC_POEM_JSON',json.dumps({'key':key,'url':r.url,'lines':lines},ensure_ascii=False,separators=(',',':')),flush=True)
            except Exception as e:print('ERROR',key,str(e)[:220])
            time.sleep(.3)
          PY
