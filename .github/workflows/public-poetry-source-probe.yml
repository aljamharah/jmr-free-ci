name: Locate Labid original poem
on:
  push:
    branches: [audit/poetry-voweled-sources-20261118]
permissions: {contents: read}
jobs:
  locate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Locate fully vowelled Labid source from author's table of contents
        run: |
          python -m pip -q install requests beautifulsoup4
          python - <<'PY'
          import requests,bs4,json
          url='https://poetry.dct.gov.ae/poets/361-لبيد-بن-ربيعة'
          r=requests.get(url,timeout=25,headers={'User-Agent':'Mozilla/5.0'});r.encoding='utf-8';s=bs4.BeautifulSoup(r.text,'html.parser')
          matches=[{'text':a.get_text(' ',strip=True)[:85],'href':a.get('href','')} for a in s.select('a[href]') if 'عَفَت' in a.get_text(' ',strip=True) or 'عفت' in a.get_text(' ',strip=True)]
          print('LABID_LINK',json.dumps({'status':r.status_code,'title':s.title.get_text(' ',strip=True) if s.title else '', 'matches':matches[:15]},ensure_ascii=False),flush=True)
          PY
