name: Inspect fully vocalized classical public poetry sources
on:
  push:
    branches: [audit/poetry-voweled-sources-20261118]
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Probe source availability and find poem content structure
        run: |
          python -m pip -q install requests beautifulsoup4
          python - <<'PY'
          import requests,bs4,re,json,time
          urls={
          'imru':'https://www.blfosha.net/poem/3000001',
          'mutanabbi1':'https://www.blfosha.net/poem/10521',
          'mutanabbi2':'https://www.blfosha.net/poem/10524',
          'mutanabbiMat1':'https://matnabi.com/poems/wahr-qlbah-mmn-qlbh-shbm',
          'mutanabbiMat2':'https://matnabi.com/poems/aly-qdr-ahl-alazm-taty-alazaym',
          'mutanabbiDct':'https://poetry.dct.gov.ae/poems/286-على-قدر-أهل-العزم-تأتي-العزائم',
          'mutanabbiDeewan':'https://deewan.app/ar/poems/المتنبي/على%20قدر%20أهل%20العزم%20تأتي%20العزائم?corpus=classical',
          'antarDct':'https://poetry.dct.gov.ae/poems/9850-هل-غادر-الشعراء-من-متردم'
          }
          for key,url in urls.items():
            try:
              r=requests.get(url,timeout=18,headers={'User-Agent':'Mozilla/5.0'},allow_redirects=True);s=bs4.BeautifulSoup(r.text,'html.parser')
              blocks=[]
              for el in s.find_all(['div','section','article','ol','ul']):
                attr=' '.join(el.get('class') or [])+' '+(el.get('id') or '')
                if re.search(r'poem|verse|bayt|bait|sh3er|abyat|content|text|hemistich|qasida',attr,re.I):
                  text=el.get_text(' ',strip=True)
                  if 50<len(text)<10000:
                    blocks.append({'tag':el.name,'class':attr[:120],'size':len(text),'first':text[:140],'p':len(el.find_all('p')),'li':len(el.find_all('li'))})
              blocks=sorted(blocks,key=lambda x:-x['size'])[:9]
              print('PROBE',json.dumps({'key':key,'status':r.status_code,'bytes':len(r.content),'final':r.url,'title':s.title.get_text(' ',strip=True)[:100] if s.title else '','blocks':blocks},ensure_ascii=False),flush=True)
            except Exception as e:print('ERROR',key,repr(e)[:180],flush=True)
            time.sleep(.25)
          PY
