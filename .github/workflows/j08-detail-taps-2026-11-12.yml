name: Validate J-08 poetry/book detail mobile tap areas
on:
  push:
    branches: [ci/j08-detail-tap-targets-2026-11-12]
permissions:
  contents: read
jobs:
  detail-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          repository: aljamharah/aljamharah
          ref: fix/j08-poetry-detail-touch-targets-2026-11-12
          token: ${{ secrets.JMR_PRIVATE_REPO_READ_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check J-08 CSS and preexisting J-06 routes
        run: node --test tests/j08-detail-mobile-touch-targets.test.mjs tests/j06-detail-return-navigation.test.mjs tests/j06-library-book-reader-navigation.test.mjs
      - name: Safe Pages build with J-01 compact meaning index
        run: node scripts/build_public_site.mjs
      - name: Verify output files, data privacy and mobile control targets
        run: |
          test -f dist/content/jmr/lexicon/meaning/manifest.json
          test -f dist/poem.html
          test -f dist/reader.html
          test ! -d dist/scripts
          test ! -d dist/database
          test ! -d dist/workers
          test ! -d dist/tests
