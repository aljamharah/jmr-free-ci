name: Discover fully vowelled al-Maarri Sakt al-Zand poem links
on:
  push:
    branches: [audit/maari-poetry-source-discovery-20261118]
permissions: {contents: read}
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Inspect index of historical 82 Sakt al-Zand poems
        run: |
          python -m pip -q install requests beautifulsoup4
          python - <<'PY'
          import requests,bs4,json,time
          for key,url in [
            ('saqt','https://poetry.dct.gov.ae/diwan/14734-سقط-الزند'),
            ('luzum','https://poetry.dct.gov.ae/diwan/11163-لزوم-ما-لا-يلزم')]:
            try:
              r=requests.get(url,timeout=26,headers={'User-Agent':'Mozilla/5.0'});r.encoding='utf-8';s=bs4.BeautifulSoup(r.text,'html.parser')
              links=[]
              for a in s.select('a[href*="/poems/"]'):
                title=a.get_text(' ',strip=True);href=a.get('href','')
                if title and href not in [x.get('href') for x in links]:links.append({'title':title[:135],'href':href})
              print('DIWAN',json.dumps({'key':key,'status':r.status_code,'url':r.url,'size':len(r.content),'poems':links[:130],'count':len(links)},ensure_ascii=False),flush=True)
            except Exception as e:print('ERROR',key,str(e)[:150],flush=True)
            time.sleep(.3)
          PY
