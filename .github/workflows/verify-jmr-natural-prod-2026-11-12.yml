name: Verify JMR natural greetings merged release on live Production without inference
on:
  push:
    branches: [ci/jmr-natural-prod-verify-2026-11-12]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Confirm real Pages Function revision and actual JMR UI with zero model calls
        run: |
          node --input-type=module <<'NODE'
          const base='https://aljamharah.pages.dev';
          const expected='natural-replies-r2';
          let verified=false;
          let finalStatus={};
          for(let i=1;i<=24;i++){
            try{
              const [method,page,search]=await Promise.all([
                fetch(base+'/api/jmr',{method:'GET',headers:{'Cache-Control':'no-cache'},signal:AbortSignal.timeout(15000)}),
                fetch(base+'/jmr.html',{headers:{'Cache-Control':'no-cache'},signal:AbortSignal.timeout(15000)}),
                fetch(base+'/search.html',{headers:{'Cache-Control':'no-cache'},signal:AbortSignal.timeout(15000)})
              ]);
              const [methodBody,html]=await Promise.all([method.json().catch(()=>null),page.text()]);
              const release=method.headers.get('X-JMR-Social-Release');
              const previous=method.headers.get('X-JMR-Revision');
              const uiReady=page.status===200 && html.includes('used_poetry_ids') &&
                html.includes('usedPoetryIds.clear()') && html.includes('id="sendButton"');
              verified=release===expected && method.status===405 &&
                methodBody?.error==='الطريقة غير مسموحة.' && uiReady && search.status===200;
              finalStatus={attempt:i,verified,apiStatus:method.status,release:release||null,
                previousRevision:previous||null,uiReady,searchStatus:search.status};
              console.log('JMR_PRODUCTION_NATURAL_RELEASE_CHECK',JSON.stringify(finalStatus));
              if(verified)break;
            }catch(error){
              console.log('JMR_PRODUCTION_NATURAL_RELEASE_RETRY',
                JSON.stringify({attempt:i,error:String(error).slice(0,260)}));
            }
            await new Promise(resolve=>setTimeout(resolve,7000));
          }
          if(verified){
            const response=await fetch(base+'/api/jmr',{
              method:'POST',
              headers:{'Content-Type':'application/json',Origin:base},
              body:'{',
              signal:AbortSignal.timeout(15000)
            });
            const payload=await response.json().catch(()=>null);
            const guard=response.status===400 &&
              payload?.error==='تعذر قراءة بيانات الطلب.' &&
              response.headers.get('X-JMR-Social-Release')===expected;
            console.log('JMR_PRODUCTION_MALFORMED_REQUEST',JSON.stringify({
              status:response.status,guard,release:response.headers.get('X-JMR-Social-Release')
            }));
            verified=verified&&guard;
          }
          console.log('JMR_NATURAL_RELEASE_LIVE_PROVEN',verified?'PASS':'NOT_VERIFIED');
          console.log('PAID_OR_REAL_MODEL_REQUESTS',0);
          if(!verified)process.exitCode=1;
          NODE
