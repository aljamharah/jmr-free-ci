name: Read-only classic poem vocalized source probe
on:
  push:
    branches: [audit/diacritics-source-probe-20261118]
permissions: {contents: read}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Fetch limited classical poetry source markup
        run: |
          python -m pip install --quiet requests beautifulsoup4
          python - <<'PY'
          import requests,bs4,re,collections,time
          urls=['https://www.aldiwan.net/poem50.html','https://www.aldiwan.net/poem10521.html','https://www.aldiwan.net/poem10524.html','https://www.aldiwan.net/poem20973.html','https://www.aldiwan.net/poem85.html','https://www.aldiwan.net/poem25065.html','https://www.aldiwan.net/poem21196.html']
          for url in urls:
              try:
                  r=requests.get(url,timeout=20,headers={'User-Agent':'Mozilla/5.0'},allow_redirects=True)
                  soup=bs4.BeautifulSoup(r.text,'html.parser')
                  candidates=[]
                  for tag in soup.find_all(['div','section','article']):
                      attrs=' '.join(tag.get('class') or [])+' '+str(tag.get('id') or '')
                      if re.search(r'poem|verse|bayt|bait|sh3er|abyat|shatr|qasid',attrs,re.I):
                          candidates.append((tag.name,attrs[:120],len(tag.get_text(' ',strip=True)),tag.get_text(' ',strip=True)[:140]))
                  candidates=sorted(candidates,key=lambda x:x[2])[:18]
                  print('SOURCE',url,'HTTP',r.status_code,'SIZE',len(r.content),'TITLE',soup.title.get_text(' ',strip=True)[:90] if soup.title else '',flush=True)
                  print('CANDIDATES',url,repr(candidates)[:1200],flush=True)
              except Exception as e: print('ERROR',url,repr(e)[:240],flush=True)
              time.sleep(.3)
          PY
