name: Al-Maarri corpus source layout probe
on:
  push:
    branches:
      - maari/intake-20261118
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Examine classical poetry page structure without saving site content
        run: |
          python - <<'PY'
          import re,time,urllib.request,html
          from urllib.parse import quote
          titles=["أرى العنقاء تكبر أن تصادا","نضحي ونمسي كبني آدم","تفقهت في الدنيا فلم تلف طائلا"]
          for title in titles:
              url="https://almaarri.com/poem/"+quote(title.replace(" ","-"))+"/"
              try:
                  request=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0 (compatible; JMRResearch/1.0; public-domain verse verification)"})
                  with urllib.request.urlopen(request,timeout=25) as response: body=response.read().decode("utf-8","replace");status=response.status
                  print("RESULT",title,"status",status,"bytes",len(body))
                  for needle in ("أرى العَنْقاءَ","نُضَحي وَنُمسي","تَفَقَّهَت في"):
                      x=body.find(needle)
                      if x>=0: print("SNIPPET",re.sub(r'\\s+',' ',body[max(0,x-360):x+600])[:1000])
              except Exception as e:
                  print("ERROR",title,type(e).__name__,str(e)[:300])
              time.sleep(1)
          PY
