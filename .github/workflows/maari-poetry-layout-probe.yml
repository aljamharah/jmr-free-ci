name: Al-Maarri corpus source layout probe
on:
  push:
    branches:
      - maari/intake-20261118
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check how many complete half-lines are in original source metadata
        run: |
          python - <<'PY'
          import time,urllib.request,re,html
          from html.parser import HTMLParser
          from urllib.parse import quote
          class P(HTMLParser):
              def __init__(self): super().__init__();self.meta={}
              def handle_starttag(self, tag, attrs):
                  d=dict(attrs)
                  if tag=="meta" and d.get("property") in ["og:description","og:title"]:
                      self.meta[d["property"]]=d.get("content","")
          import urllib.robotparser
          for domain in ["https://almaarri.com","https://www.aldiwan.net","https://ar.wikisource.org","https://poetsgate.com"]:
              try:
                  robot=urllib.robotparser.RobotFileParser()
                  robot.set_url(domain+"/robots.txt")
                  robot.read()
                  print("ROBOTS",domain,"may_fetch",robot.can_fetch("JamharahLiteraryProject/1.0",domain+"/poem/example/"),"allow_all",robot.allow_all,"disallow_all",robot.disallow_all)
                  req=urllib.request.Request(domain+"/robots.txt",headers={"User-Agent":"Mozilla/5.0"})
                  try:
                      with urllib.request.urlopen(req,timeout=12) as resp: print("ROBOTS_HTTP",domain,resp.status,repr(resp.read(1200).decode("utf-8","replace")))
                  except Exception as e: print("ROBOTS_RESPONSE_ERROR",domain,str(e)[:180])
              except Exception as e: print("ROBOTS_ERROR",domain,str(e)[:180])
          titles=["أرى العنقاء تكبر أن تصادا","نضحي ونمسي كبني آدم","تفقهت في الدنيا فلم تلف طائلا","غير مجد في ملتي واعتقادي"]
          for title in titles:
              url="https://almaarri.com/poem/"+quote(title.replace(" ","-"))+"/"
              try:
                  request=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0 (compatible; JMRResearch/1.0; verification of public-domain poetry)"})
                  with urllib.request.urlopen(request,timeout=25) as response:
                      body=response.read().decode("utf-8","replace")
                  p=P();p.feed(body)
                  desc=p.meta.get("og:description","")
                  lines=[x.strip() for x in desc.splitlines() if x.strip()]
                  print("TITLE",title,"META_TITLE",p.meta.get("og:title"),"CHARS",len(desc),"LINES",len(lines),"FIRST",repr(lines[:2]),"LAST",repr(lines[-2:]))
                  pos=body.rfind(lines[0]) if lines else -1
                  print("DOM_FRAGMENT",title,repr(body[max(0,pos-270):pos+750]).replace("\\n","\\n")[:1600])
              except Exception as e:
                  print("ERROR",title,type(e).__name__,str(e)[:250])
              time.sleep(0.5)
          PY
