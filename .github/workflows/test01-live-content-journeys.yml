name: TEST-01 live book detail and poem action journeys (public GET only)
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/test01-live-content-journeys.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: test01-public-reader-journeys
  cancel-in-progress: false
jobs:
  journeys:
    if: github.repository == 'aljamharah/jmr-free-ci' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.actor == 'aljamharah'))
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout public harness without credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install disposable browser tooling
        run: |
          mkdir -p "$RUNNER_TEMP/test01-content"
          cd "$RUNNER_TEMP/test01-content"
          npm install --no-audit --no-fund --no-save --package-lock=false playwright@1.56.1 >/dev/null
          if ! command -v google-chrome >/dev/null 2>&1; then npx playwright install chromium >/dev/null; fi
      - name: Check all indexed book states and three vowelled poem actions
        run: |
          set -euo pipefail
          cp scripts/test01-live-content-journeys.mjs "$RUNNER_TEMP/test01-content/audit.mjs"
          cd "$RUNNER_TEMP/test01-content"
          node audit.mjs
