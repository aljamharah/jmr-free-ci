name: Diagnose Cloudflare Pages listing GET query (redacted)

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cloudflare-pages-query-diagnostic.yml"

permissions:
  contents: read

jobs:
  probe:
    if: github.repository == 'aljamharah/jmr-free-ci' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Probe safe pagination variations with GET only
        env:
          ACCOUNT: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          TOKEN: ${{ secrets.ALJAMHARAH_CF_MAINTENANCE_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          const account=process.env.ACCOUNT,token=process.env.TOKEN;
          if(!/^[a-f0-9]{32}$/i.test(account||'')||!(token?.length>=12))throw Error('Read-only account credentials absent');
          const base='https://api.cloudflare.com/client/v4/accounts/'+account+'/pages/projects/aljamharah/deployments';
          const variants=[
            {env:'production',page:1,per_page:100},
            {env:'production',page:1,per_page:50},
            {env:'production',page:1,per_page:25},
            {env:'production',page:1,per_page:20},
            {env:'production',page:1,per_page:10},
            {page:1,per_page:20},
            {env:'preview',page:1,per_page:20}
          ];
          let valid=0;
          for(const params of variants){
            const q=new URLSearchParams(params).toString();
            const r=await fetch(base+'?'+q,{method:'GET',redirect:'error',headers:{Authorization:'Bearer '+token,Accept:'application/json'},signal:AbortSignal.timeout(12000)});
            const payload=await r.json().catch(()=>null);
            const info=payload?.result_info||{};
            const recordCount=Array.isArray(payload?.result)?payload.result.length:null;
            const shape=Array.isArray(payload?.result)?{
              missing_aliases:payload.result.filter(r=>!Object.hasOwn(r,'aliases')).length,
              null_aliases:payload.result.filter(r=>r.aliases===null).length,
              array_aliases:payload.result.filter(r=>Array.isArray(r.aliases)).length,
              other_aliases:payload.result.filter(r=>r.aliases!==null&&r.aliases!==undefined&&!Array.isArray(r.aliases)).length,
              null_urls:payload.result.filter(r=>r.url===null||r.url===undefined).length
            }:null;
            if(r.ok&&payload?.success===true)valid++;
            console.log(JSON.stringify({
              parameters:params,status:r.status,success:payload?.success===true,
              error_code:Number.isInteger(payload?.errors?.[0]?.code)?payload.errors[0].code:null,
              result_count:recordCount,shape,
              result_info_fields:Object.keys(info).sort(),
              pagination:{page:info.page??null,per_page:info.per_page??null,total_pages:info.total_pages??null}
            }));
          }
          console.log('read_only=true; secret_values_printed=false; full_deployment_records_printed=false');
          if(!valid)throw Error('No valid GET pagination shape; inventory blocked safely');
          NODE
