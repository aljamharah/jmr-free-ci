name: J08 PR110 exact source-only CLS fix latest-main virtual merge

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/j08-pr110-current-main-safe-cls-virtual-merge.yml

permissions:
  contents: read

jobs:
  audit:
    if: github.repository == 'aljamharah/jmr-free-ci' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          repository: aljamharah/aljamharah
          ref: 688275cb78d4e1014ec683cee4db8e4a0c7c0937
          token: ${{ secrets.JMR_PRIVATE_REPO_READ_TOKEN }}
          persist-credentials: false
          path: baseline
      - uses: actions/checkout@v4
        with:
          repository: aljamharah/aljamharah
          ref: 2bbd45995f275b0d69515b7bf71c0f3fc4759264
          token: ${{ secrets.JMR_PRIVATE_REPO_READ_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
          path: candidate
      - name: Disposable local merge and exact CSS insertion proof
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C baseline rev-parse HEAD)" = "688275cb78d4e1014ec683cee4db8e4a0c7c0937"
          test "$(git -C candidate rev-parse HEAD)" = "2bbd45995f275b0d69515b7bf71c0f3fc4759264"
          git -C candidate fetch --no-tags ../baseline 688275cb78d4e1014ec683cee4db8e4a0c7c0937
          git -C candidate -c user.name='Read-only CSS QA' \
            -c user.email='css@invalid.example' merge --no-ff --no-edit 688275cb78d4e1014ec683cee4db8e4a0c7c0937 >/dev/null
          git -C candidate diff --name-status 688275cb78d4e1014ec683cee4db8e4a0c7c0937 HEAD > /tmp/j08-only-source.txt
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          const diff=readFileSync('/tmp/j08-only-source.txt','utf8').trim();
          assert.equal(diff,'M\tlibrary.html','Only the library entrypoint may change');
          const before=readFileSync('baseline/library.html','utf8');
          const after=readFileSync('candidate/library.html','utf8');
          const inserted=String.raw`
/* CLS guard only while the initial grid is empty. As soon as renderCategories
   appends the six cards, this rule stops matching: no lasting visual change. */
#categories:empty{min-height:310px}
@media(min-width:601px) and (max-width:850px){#categories:empty{min-height:472px}}
@media(max-width:600px){#categories:empty{min-height:max(402px,calc(807px - 110vw))}}`;
          assert.equal(after.split(inserted).length,2,'CSS-only guard insertion missing or repeated');
          assert.equal(after.replace(inserted,''),before,
            'Post-merge HTML must be identical except the exact transient empty-grid style');
          console.log('Exact CSS insertion only; no static page content, JS, brand, API or CMS changes.');
          NODE
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install free validation libraries
        run: python -m pip install --disable-pip-version-check python-frontmatter pyyaml
      - name: Build both sanitized public sites
        run: |
          (cd baseline && node scripts/build_public_site.mjs)
          (cd candidate && node scripts/build_public_site.mjs)
      - name: Require only library.html public HTML changes and other 873 files identical
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          function map(dir){const x=JSON.parse(readFileSync(dir+'/build-reports/dist-inventory.json','utf8'));return new Map(x.files.map(v=>[v.path,v]));}
          const a=map('baseline'),b=map('candidate');
          assert.equal(a.size,874);
          assert.equal(b.size,874);
          assert.deepEqual([...a.keys()].sort(),[...b.keys()].sort());
          const differences=[...a.keys()].filter(path=>a.get(path).sha256!==b.get(path).sha256||a.get(path).bytes!==b.get(path).bytes);
          assert.deepEqual(differences,['library.html'],'Exactly one public HTML file must differ');
          console.log(JSON.stringify({old_files:a.size,new_files:b.size,changed:['library.html'],other_files_identical:873}));
          NODE
      - name: Run complete Node suite on baseline and virtual merged candidate
        shell: bash
        run: |
          set +e
          (cd baseline && node --test >../before.tap 2>&1)
          b=$?
          (cd candidate && node --test >../after.tap 2>&1)
          c=$?
          set -e
          BASE="$b" CAND="$c" node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          function metrics(file){const t=readFileSync(file,'utf8');const v=k=>Number(t.match(new RegExp('^# '+k+' (\\d+)$','m'))?.[1]??-1);return {tests:v('tests'),pass:v('pass'),fail:v('fail')};}
          const b=metrics('before.tap'),c=metrics('after.tap');
          console.log(JSON.stringify({baseline:b,candidate:c,baseline_exit:process.env.BASE,candidate_exit:process.env.CAND}));
          assert.equal(process.env.BASE,'0');assert.equal(process.env.CAND,'0');
          assert.deepEqual(c,b);assert.ok(c.tests>=204);assert.equal(c.tests,c.pass);
          NODE
      - name: Foundation, Python source and edited-published rights checks
        working-directory: candidate
        run: |
          node scripts/check_site_foundation.mjs
          python scripts/validate_library.py
          python -m unittest discover -s tests -p 'test_*.py'
      - name: Ensure source trees unchanged after local validation
        run: |
          git -C baseline diff --exit-code
          git -C candidate diff --exit-code
          git -C baseline diff --cached --exit-code
          git -C candidate diff --cached --exit-code
          echo 'PASS: zero data or model changes. PR110 is a transient CSS-only empty category-grid optimization.'
