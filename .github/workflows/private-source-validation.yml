name: Validate private JMR source

on:
  push:
    branches: [ci/technical-closeout-2026-11-13]
  workflow_dispatch:
    inputs:
      preview_url:
        description: "Full verified HTTPS Preview origin only; leave empty for offline-only tests"
        required: false
        type: string
        default: ""
      run_semantic_live_checks:
        description: "Send two real model questions to verify poet retrieval and Quran isolation; requires available Workers AI quota."
        required: false
        type: boolean
        default: false

permissions:
  contents: read

# The fine-grained token must have Contents: Read-only on aljamharah/aljamharah.

concurrency:
  group: jmr-private-source-validation-closeout
  cancel-in-progress: true

jobs:
  validate:
    if: github.actor == 'aljamharah' && github.ref == 'refs/heads/ci/technical-closeout-2026-11-13'
    name: Validate canonical private repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out public validation harness
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Require read-only private repository token
        env:
          PRIVATE_REPO_READ_TOKEN: ${{ secrets.JMR_PRIVATE_REPO_READ_TOKEN }}
        run: |
          if [ -z "$PRIVATE_REPO_READ_TOKEN" ]; then
            echo "::error::Missing JMR_PRIVATE_REPO_READ_TOKEN. Add a fine-grained token with Contents: Read-only for aljamharah/aljamharah."
            exit 1
          fi

      - name: Check out canonical private source (read only)
        uses: actions/checkout@v4
        with:
          repository: aljamharah/aljamharah
          ref: maintenance/technical-closeout-2026-11-13
          token: ${{ secrets.JMR_PRIVATE_REPO_READ_TOKEN }}
          path: private-source
          fetch-depth: 1
          persist-credentials: false

      - name: Confirm exact private branch revision
        working-directory: private-source
        run: |
          test "$(git rev-parse HEAD)" = "a63a811880a94405260afa78cf76b31bae45ef17"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install public validation dependencies
        run: python -m pip install --disable-pip-version-check python-frontmatter pyyaml

      - name: Validate library publication rights and regenerate matching metadata in a sandbox
        working-directory: private-source
        run: |
          python scripts/validate_library.py
          python -m unittest discover -s tests -p 'test_library_generated_sync.py'

      - name: Validate private JMR knowledge registry
        working-directory: private-source
        run: python scripts/validate_jmr_knowledge.py

      - name: Validate canonical Quran corpus and attribution
        working-directory: private-source
        run: node scripts/validate_jmr_quran.mjs

      - name: Build safe static site and verify full-file SHA inventory before tests
        working-directory: private-source
        run: |
          node scripts/test_public_site_build.mjs
          node scripts/audit_site_links.mjs
          node scripts/test_header_navigation.mjs

      - name: Archive published-file inventory (paths, sizes, SHA-256 only)
        uses: actions/upload-artifact@v4
        with:
          name: jamharah-public-dist-inventory-2026-11-13
          path: private-source/build-reports/dist-inventory.json
          if-no-files-found: error
          retention-days: 14

      - name: Run private JMR API and Quran tests
        working-directory: private-source
        run: npm test

      - name: Run mobile and desktop real-browser regression with local public dist
        working-directory: private-source
        run: |
          npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright
          node scripts/test_browser_navigation.mjs

      - name: Build and validate published poet biographies
        working-directory: private-source
        run: |
          python scripts/build_jmr_poets_index.py
          python -m unittest discover -s tests -p 'test_jmr_poets_index.py'

      - name: Run JMR retrieval/runtime smoke tests
        working-directory: private-source
        run: node scripts/test_jmr_runtime.mjs

      - name: Validate evaluation runner without contacting Preview
        working-directory: private-source
        run: node scripts/evaluate_jmr_preview.mjs --dry-run --suite generative-smoke

      - name: Check JMR Worker syntax
        working-directory: private-source
        run: node --input-type=module --check < functions/api/jmr.js

      - name: Run JMR API mock tests
        working-directory: private-source
        run: node scripts/test_jmr_api.mjs

      - name: Run Preview rate-limit unit tests
        working-directory: private-source
        run: node --test tests/rate-limit.test.js

      - name: Install Durable Object test dependencies
        working-directory: private-source/workers/jmr-ratelimit-do
        run: npm install --no-audit --no-fund --legacy-peer-deps --package-lock=false

      - name: Run Durable Object concurrency and expiry tests
        working-directory: private-source/workers/jmr-ratelimit-do
        run: npm test

      - name: Verify exact a63a811 Cloudflare Preview (GET only, no AI usage)
        env:
          JMR_PREVIEW_ORIGIN: https://ea63d216.aljamharah-staging.pages.dev
        run: |
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          const origin = process.env.JMR_PREVIEW_ORIGIN;
          if (new URL(origin).hostname !== "ea63d216.aljamharah-staging.pages.dev") throw new Error("Unexpected Preview origin");
          const routes = [
            ["/",200],["/sitemap.xml",200],["/robots.txt",200],
            ["/search.html",200],["/jmr.html",200],["/content/poems.json",200],
            ["/content/books/index.json",200],["/content/books/records/akhfash-qawafi.json",200],["/api/jmr",405]
          ];
          const results = [];
          for (const [route, expected] of routes) {
            const response=await fetch(origin+route,{method:"GET",signal:AbortSignal.timeout(20000)});
            results.push(route+" "+response.status);
            assert.equal(response.status,expected,route+" HTTP status mismatch");
            if (route==="/content/poems.json") {
              const payload=await response.json();
              assert.ok(Array.isArray(payload.poems));
              assert.ok(payload.poems.every(x=>x.publication_status==="published"));
              assert.ok(payload.poems.every(x=>!Object.hasOwn(x,"editorial_token")&&!Object.hasOwn(x,"rights_basis")));
            }
            if (route==="/sitemap.xml") assert.ok((await response.text()).includes("/search.html"));
            if (route==="/content/books/records/akhfash-qawafi.json") {
              const book=await response.json();
              assert.equal(book.rights_status,"pending_review");
              assert.equal(book.reading_allowed,false);
              assert.equal(book.rights_basis_verified,false);
              assert.equal(book.external_embed_allowed,false);
              assert.equal(book.external_embed_url,"");
              assert.ok(book.external_source_url.startsWith("https://archive.org/details/"));
            }
          }
          console.log("Live, GET-only Cloudflare Preview checks: "+results.join(", "));
          NODE

      - name: Verify manual Preview URL is a trusted aljamharah.pages.dev preview origin
        if: github.event_name == 'workflow_dispatch' && inputs.preview_url != ''
        env:
          PREVIEW_URL: ${{ inputs.preview_url }}
        run: |
          node --input-type=module <<'NODE'
          const input = process.env.PREVIEW_URL || '';
          if (!/^https:\/\/[a-z0-9-]+\.aljamharah\.pages\.dev$/.test(input)) {
            throw new Error('Only a verified aljamharah.pages.dev Preview origin is accepted; no paths, ports or query strings.');
          }
          console.log('Preview URL format validated (availability must be checked by following tests).');
          NODE

      - name: Explain why live Preview checks are manual
        if: github.event_name == 'push'
        run: |
          echo "The retired jmr-preview-rate-limit-2026 alias returns 404. Offline validation still runs on every push; live Preview checks require a fresh verified Preview URL in workflow_dispatch." >> "$GITHUB_STEP_SUMMARY"

      - name: Check deployed JMR Preview page and API guard
        if: github.event_name == 'workflow_dispatch' && inputs.preview_url != ''
        env:
          PREVIEW_URL: ${{ inputs.preview_url }}
        run: |
          set -euo pipefail
          page_status="$(curl --silent --show-error --location --max-time 25 \
            --retry 5 --retry-all-errors --retry-delay 5 \
            --output /tmp/jmr-preview.html --write-out '%{http_code}' \
            "$PREVIEW_URL/jmr.html")"
          echo "Preview chat page HTTP status: $page_status"
          test "$page_status" = "200"
          grep -q 'id="askForm"' /tmp/jmr-preview.html
          api_status="$(curl --silent --show-error --location --max-time 25 \
            --output /tmp/jmr-api-get.json --write-out '%{http_code}' \
            "$PREVIEW_URL/api/jmr")"
          echo "GET /api/jmr status: $api_status"
          test "$api_status" = "405"
          data_status="$(curl --silent --show-error --location --max-time 25 \
            --output /tmp/jmr-poets-index.json --write-out '%{http_code}' \
            "$PREVIEW_URL/content/poets/index.json")"
          echo "Poet index HTTP status: $data_status"
          test "$data_status" = "200"
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          const index = JSON.parse(readFileSync("/tmp/jmr-poets-index.json", "utf8"));
          if (!Array.isArray(index.records) || index.records.length !== 11 ||
              !index.records.some(record => record.id === "al-mutanabbi")) {
            throw new Error("The live Preview poet index is missing required published records.");
          }
          console.log("Preview poet index verified: " + index.records.length + " published records.");
          NODE
          poets_page_status="$(curl --silent --show-error --location --max-time 25 \
            --output /tmp/jmr-poets.html --write-out '%{http_code}' \
            "$PREVIEW_URL/poets.html?id=al-mutanabbi")"
          echo "Poet directory page HTTP status: $poets_page_status"
          test "$poets_page_status" = "200"
          node --input-type=module <<'NODE'
          const endpoint = new URL("/api/jmr", process.env.PREVIEW_URL).href;
          const response = await fetch(endpoint, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              message: "أعرب: إنما يخشى الله من عباده العلماء، وهل نسبها المتنبي؟",
              conversation: []
            }),
            signal: AbortSignal.timeout(30000)
          });
          const payload = await response.json();
          if (response.status !== 200 ||
              payload.mode !== "curated_exact_answer" ||
              payload.answer_kind !== "quranic_verse" ||
              payload.quran_verification?.status !== "verified" ||
              !payload.answer.includes("سورة فاطر، الآية 28") ||
              !payload.answer.includes("ليست بيتاً شعرياً") ||
              (payload.poet_matches || []).length !== 0 ||
              (payload.sources || []).some(source =>
                source.url === "https://www.arab-ency.com.sy/details/7538" ||
                source.url === "https://uqu.edu.sa/App/Poetry/Poets/365"
              )) {
            throw new Error("Live reviewed Quran path failed its source/isolation checks: " + JSON.stringify(payload));
          }
          console.log("Live reviewed Quran answer verified; no poet match/source leaked; no model call required.");
          NODE
          echo "Preview page, poet index, reviewed Quran path and API method guard verified."

      - name: Send one real language question to JMR Preview
        if: github.event_name == 'workflow_dispatch' && inputs.run_semantic_live_checks && inputs.preview_url != ''
        working-directory: private-source
        env:
          JMR_PREVIEW_URL: ${{ inputs.preview_url }}
        run: |
          node scripts/evaluate_jmr_preview.mjs --limit 1 --out /tmp/jmr-live-smoke-report.json
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          const report = JSON.parse(readFileSync("/tmp/jmr-live-smoke-report.json", "utf8"));
          const result = report.results?.[0];
          if (!result?.ok) {
            console.error(JSON.stringify({
              id: result?.id,
              http_status: result?.http_status,
              error: result?.error,
              answer: result?.answer
            }, null, 2));
            process.exit(1);
          }
          console.log(JSON.stringify({
            id: result.id,
            http_status: result.http_status,
            answer_length: result.answer.length,
            source_count: result.sources.length,
            answer_kind: result.answer_kind
          }, null, 2));
          NODE

      - name: Verify live poet retrieval and Quran isolation
        if: github.event_name == 'workflow_dispatch' && inputs.run_semantic_live_checks && inputs.preview_url != ''
        env:
          JMR_PREVIEW_URL: ${{ inputs.preview_url }}
        run: |
          node --input-type=module <<'NODE'
          const endpoint = new URL("/api/jmr", process.env.JMR_PREVIEW_URL).href;
          async function ask(message) {
            const response = await fetch(endpoint, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ message, conversation: [] }),
              signal: AbortSignal.timeout(90000)
            });
            const payload = await response.json();
            if (!response.ok || typeof payload.answer !== "string" || !payload.answer.trim()) {
              throw new Error("Live JMR request failed: HTTP " + response.status + " " + JSON.stringify(payload));
            }
            return payload;
          }

          const poet = await ask("من هو أبو الطيب المتنبي؟");
          const biography = (poet.poet_matches || []).find(item => item.id === "al-mutanabbi");
          if (!biography) {
            throw new Error("Live poet retrieval did not return al-mutanabbi: " + JSON.stringify(poet.poet_matches));
          }
          if (!(poet.sources || []).some(source =>
            source.url === "https://www.arab-ency.com.sy/details/7538" ||
            source.url === "https://uqu.edu.sa/App/Poetry/Poets/365"
          )) {
            throw new Error("The live poet response did not include its registered biography references.");
          }
          console.log(JSON.stringify({
            check: "poet_biography",
            http_status: 200,
            poet_id: biography.id,
            era: biography.era,
            sources: (poet.sources || []).length
          }));

          await new Promise(resolve => setTimeout(resolve, 5200));
          const quran = await ask("ما مصدر هذه الآية القرآنية: ربنا آتنا من لدنك رحمة؟ وهل ترتبط بالمتنبي؟");
          if (quran.quran_verification?.status !== "verified") {
            throw new Error("The Quran-sensitive live request was not verified: " + JSON.stringify(quran.quran_verification));
          }
          if ((quran.poet_matches || []).length !== 0) {
            throw new Error("Poet biographies leaked into a Quran-sensitive response: " + JSON.stringify(quran.poet_matches));
          }
          if ((quran.sources || []).some(source =>
            source.url === "https://www.arab-ency.com.sy/details/7538" ||
            source.url === "https://uqu.edu.sa/App/Poetry/Poets/365"
          )) {
            throw new Error("Poet references leaked into the Quran-sensitive source list.");
          }
          console.log(JSON.stringify({
            check: "quran_poet_isolation",
            http_status: 200,
            verification: quran.quran_verification.status,
            poet_matches: 0,
            answer_length: quran.answer.length
          }));
          NODE
