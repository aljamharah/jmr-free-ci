name: Validate final engineering closeout (free independent CI)
on:
  push:
    branches: [ci/engineering-closeout-2026-11-11]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact private candidate read-only
        uses: actions/checkout@v4
        with:
          repository: aljamharah/aljamharah
          ref: af7872c24a94b43f5b9ced05ab5996df0e28d9cc
          token: ${{ secrets.JMR_PRIVATE_REPO_READ_TOKEN }}
          persist-credentials: false
          path: source
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install library validator dependencies
        run: python -m pip install --disable-pip-version-check python-frontmatter pyyaml
      - name: Validate CMS and CI YAML
        working-directory: source
        run: |
          python - <<'PY'
          import yaml
          from pathlib import Path
          for name in ['admin/config.yml','.github/workflows/build-library-index.yml','.github/workflows/validate-library.yml']:
              obj=yaml.safe_load(Path(name).read_text(encoding='utf8'))
              assert isinstance(obj, dict)
              print('YAML_OK',name)
          PY
      - name: Validate publication rights and library
        working-directory: source
        run: python scripts/validate_library.py
      - name: Run all ten consolidated engineering regressions
        working-directory: source
        run: node scripts/check_site_foundation.mjs
      - name: JMR evaluation dry run only
        working-directory: source
        run: node scripts/evaluate_jmr_preview.mjs --dry-run --limit 2
      - name: Ensure no source files changed
        working-directory: source
        run: git diff --exit-code -- .
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact candidate read-only
        uses: actions/checkout@v4
        with:
          repository: aljamharah/aljamharah
          ref: af7872c24a94b43f5b9ced05ab5996df0e28d9cc
          token: ${{ secrets.JMR_PRIVATE_REPO_READ_TOKEN }}
          persist-credentials: false
          path: source
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install free local browser test dependencies
        working-directory: source
        run: |
          npm install --no-save --package-lock=false --no-audit --no-fund playwright@1.56.1
          if ! command -v google-chrome >/dev/null 2>&1; then npx playwright install --with-deps chromium; fi
      - name: Build sanitized local browser fixture
        working-directory: source
        run: node scripts/build_public_site.mjs
      - name: Run mobile, desktop and JMR UI Chromium tests
        working-directory: source
        run: node scripts/test_browser_navigation.mjs
  durable-object:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          repository: aljamharah/aljamharah
          ref: af7872c24a94b43f5b9ced05ab5996df0e28d9cc
          token: ${{ secrets.JMR_PRIVATE_REPO_READ_TOKEN }}
          persist-credentials: false
          path: source
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install local Cloudflare Workerd test pool
        working-directory: source/workers/jmr-ratelimit-do
        run: npm install --legacy-peer-deps --no-audit --no-fund --no-save --package-lock=false
      - name: Validate SQLite atomic free-tier rate limiting
        working-directory: source/workers/jmr-ratelimit-do
        run: npm test
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Real production read-only smoke test without paid inference
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const base='https://aljamharah.pages.dev';
          async function get(path) {
            const r=await fetch(base+path,{signal:AbortSignal.timeout(20000)});
            return {status:r.status,headers:r.headers,body:await r.text()};
          }
          const pages=['index.html','catalog.html','lexicon.html','library.html','book.html','reader.html','poets.html','poet.html','poem.html','jmr.html'];
          for (const p of pages) {
            const r=await get('/'+p);
            assert.equal(r.status,200,p);
            assert.ok(r.body.includes('assets/AFF71118-81CC-48DF-A661-4410C687EC8F.png'),p+' logo');
            console.log('LIVE_PAGE_OK',p);
          }
          for (const p of ['/content/poems.json','/content/%70oems.json','/content/poems%2Ejson']) {
            const r=await get(p);
            assert.equal(r.status,200,p);
            const data=JSON.parse(r.body);
            assert.ok(Array.isArray(data.poems),p+' shape');
            assert.ok(data.poems.every(x=>x.publication_status==='published' &&
               !['rights_basis','text_attribution','editorial_note','editorial_token'].some(k=>Object.hasOwn(x,k))),p+' editorial leak');
            console.log('LIVE_POEMS_SAFE',p,'records',data.poems.length);
          }
          const api=await get('/api/jmr');
          assert.equal(api.status,405);
          assert.match(api.headers.get('cache-control')||'',/no-store/);
          console.log('LIVE_JMR_GUARD_OK 405');
          NODE
