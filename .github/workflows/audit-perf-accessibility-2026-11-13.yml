name: PR81 preview performance and WCAG compare
on:
  push:
    branches: [ci/pr81-preview-perf-a11y-2026-11-13]
permissions:
  contents: read
jobs:
  audit:
    if: github.actor == 'aljamharah' && github.ref == 'refs/heads/ci/pr81-preview-perf-a11y-2026-11-13'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install audit-only dependencies
        run: npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright @axe-core/playwright
      - name: GET-only Chrome mobile performance baseline, WCAG A/AA
        env:
          SITE: https://02cbfe8d.aljamharah.pages.dev
        run: |
          node --input-type=module <<'NODE'
          import {chromium} from "playwright";
          import AxeBuilder from "@axe-core/playwright";
          import assert from "node:assert/strict";
          let browser;
          try{browser=await chromium.launch({channel:"chrome",headless:true,args:["--no-sandbox"]})}
          catch{browser=await chromium.launch({headless:true,args:["--no-sandbox"]})}
          const origin=process.env.SITE;
          const results=[];
          const pages=["/","/lexicon.html","/library.html","/jmr.html","/search.html","/poets.html","/book.html","/poem.html"];
          try{
           for(const path of pages){
            const context=await browser.newContext({viewport:{width:390,height:844},locale:"ar",reducedMotion:"reduce",colorScheme:"dark"});
            await context.route("**/*",route=>{
              if(route.request().method()!=="GET")return route.abort();
              return route.continue();
            });
            const page=await context.newPage();
            const errors=[];page.on("pageerror",e=>errors.push(e.message));
            await page.addInitScript(()=>{
              window.__audit={lcp:0,cls:0};
              try{new PerformanceObserver(list=>{for(const e of list.getEntries())window.__audit.lcp=e.startTime}).observe({type:"largest-contentful-paint",buffered:true})}catch{}
              try{new PerformanceObserver(list=>{for(const e of list.getEntries())if(!e.hadRecentInput)window.__audit.cls+=e.value}).observe({type:"layout-shift",buffered:true})}catch{}
            });
            const client=await context.newCDPSession(page);
            await client.send("Network.enable");
            await client.send("Network.setCacheDisabled",{cacheDisabled:true});
            const req=new Map();let total=0;
            client.on("Network.responseReceived",ev=>req.set(ev.requestId,{url:ev.response.url,type:ev.type}));
            const heavy=[];
            client.on("Network.loadingFinished",ev=>{const item=req.get(ev.requestId);if(!item)return;const bytes=ev.encodedDataLength||0;total+=bytes;heavy.push({path:new URL(item.url).pathname,bytes,type:item.type})});
            const throttle=["/","/lexicon.html","/jmr.html","/search.html"].includes(path);
            if(throttle){
              await client.send("Network.emulateNetworkConditions",{offline:false,latency:150,downloadThroughput:250000,uploadThroughput:125000});
              await client.send("Emulation.setCPUThrottlingRate",{rate:4});
            }
            const start=Date.now();
            let load,loadError="";
            try{const response=await page.goto(origin+path,{waitUntil:"load",timeout:70000});load=response?.status()??0;}
            catch(e){loadError=String(e.message).slice(0,120);load=0}
            await page.waitForTimeout(800);
            const measures=await page.evaluate(()=>({
              lcp:Math.round(window.__audit?.lcp||0),cls:Number((window.__audit?.cls||0).toFixed(4)),
              dcl:Math.round(performance.getEntriesByType("navigation")[0]?.domContentLoadedEventEnd||0),
              pageScrollWidth:document.documentElement.scrollWidth
            }));
            let violations=[];
            try{
              const result=await new AxeBuilder({page}).withTags(["wcag2a","wcag2aa","wcag21a","wcag21aa"]).analyze();
              violations=result.violations.map(v=>({id:v.id,impact:v.impact,count:v.nodes.length,targets:v.nodes.slice(0,2).map(n=>n.target?.[0]).filter(Boolean)}));
            }catch(e){violations=[{id:"axe-audit-error",impact:"unknown",count:0,message:String(e.message).slice(0,100)}]}
            const top=heavy.sort((a,b)=>b.bytes-a.bytes).slice(0,5).map(v=>({path:v.path,KiB:Math.round(v.bytes/1024)}));
            const result={path,mode:throttle?"4G-lab-4xCPU":"unthrottled",status:load,
              elapsedMs:Date.now()-start,dclMs:measures.dcl,lcpMs:measures.lcp,cls:measures.cls,
              encodedKiB:Math.round(total/1024),requests:heavy.length,
              scrollExcess:Math.max(0,measures.pageScrollWidth-390),errors:errors.length,
              topResources:top,wcagViolations:violations};
            results.push(result);
            console.log("LIVE_AUDIT "+JSON.stringify(result));
            await context.close();
           }
           assert.ok(results.every(r=>r.status===200),"One or more audited pages failed to load");
           assert.ok(results.every(r=>r.scrollExcess===0 && r.errors===0),"Horizontal overflow or JS errors detected");
           assert.ok(results.every(r=>r.encodedKiB<1600),"Excessive page transfer; probable unoptimized logo regression");
           assert.ok(results.every(r=>!r.topResources.some(x=>x.path.endsWith("AFF71118-81CC-48DF-A661-4410C687EC8F.png"))),"Original multi-megabyte logo loaded on Chrome");
           const wcag=results.flatMap(r=>r.wcagViolations.map(v=>({page:r.path,...v})));
           assert.deepEqual(wcag,[],"Critical/supported WCAG A/AA issue detected: "+JSON.stringify(wcag));
           console.log("PR81_ACCESSIBILITY_AND_PAYLOAD_GATES PASS pages="+results.length+" maxKiB="+Math.max(...results.map(r=>r.encodedKiB))+" violations="+wcag.length);
           const count=results.reduce((n,r)=>n+r.wcagViolations.length,0);
           console.log("AUDIT_COMPLETE pages="+results.length+" totalWCAGFindingTypes="+count+" simulated4Gpages=4; GET-only; AI_calls=0; no production writes");
          }finally{await browser.close()}
          NODE
