name: SEC-02 public Git history secret scan

on:
  push:
    branches: [sec-02/public-history-scan-2026-11-24]
    paths: ['.github/workflows/sec02-public-history-secret-scan.yml']
  workflow_dispatch:

permissions: {}

jobs:
  scan:
    if: github.repository == 'aljamharah/jmr-free-ci' && github.actor == 'aljamharah' && ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event_name == 'push' && github.ref == 'refs/heads/sec-02/public-history-scan-2026-11-24'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Scan public mirror without credentials or publishing findings
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          url="https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz"
          curl --fail --silent --show-error --location --max-time 90 "$url" -o "$tmp/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$tmp/gitleaks.tar.gz" -C "$tmp" gitleaks
          "$tmp/gitleaks" version
          export GIT_TERMINAL_PROMPT=0
          git -c credential.helper= clone --mirror --quiet https://github.com/aljamharah/jmr-free-ci.git "$tmp/repo.git"
          git --git-dir="$tmp/repo.git" fsck --full --no-reflogs >"$tmp/fsck.log" 2>&1
          heads="$(git --git-dir="$tmp/repo.git" for-each-ref --format='%(refname)' refs/heads | wc -l)"
          tags="$(git --git-dir="$tmp/repo.git" for-each-ref --format='%(refname)' refs/tags | wc -l)"
          refs="$(git --git-dir="$tmp/repo.git" for-each-ref --format='%(refname)' | wc -l)"
          commits="$(git --git-dir="$tmp/repo.git" rev-list --all --count)"
          printf 'heads=%s tags=%s refs=%s unique_reachable_commits=%s\n' "$heads" "$tags" "$refs" "$commits"
          test "$heads" -gt 0
          test "$commits" -gt 0
          set +e
          "$tmp/gitleaks" git --redact=100 --no-banner --no-color --ignore-gitleaks-allow --gitleaks-ignore-path=/dev/null --log-opts="--all --full-history -m" --report-format=json --report-path="$tmp/report.json" --exit-code=42 "$tmp/repo.git" >"$tmp/scan.log" 2>&1
          rc=$?
          set -e
          python3 - "$tmp" "$rc" <<'PY'
          import json, pathlib, re, sys
          p = pathlib.Path(sys.argv[1])
          rc = int(sys.argv[2])
          if rc not in (0,42):
              print("scan_status=error scanner_exit=" + str(rc))
              sys.exit(1)
          log = (p / "scan.log").read_text(errors="replace")
          counts = re.findall(r"(\d+)\s+commits?\s+scanned", log)
          if not counts or int(counts[-1]) <= 0:
              print("scan_status=unverified_missing_commit_count")
              sys.exit(1)
          print("scanner_reported_commits=" + counts[-1])
          report = p / "report.json"
          if not report.is_file():
              print("scan_status=unverified_missing_report")
              sys.exit(1)
          findings = json.loads(report.read_text())
          if not isinstance(findings, list):
              print("scan_status=invalid_report")
              sys.exit(1)
          print("findings_count=" + str(len(findings)))
          if rc == 42 or findings:
              print("scan_status=findings_require_private_review")
              sys.exit(1)
          print("scan_status=completed_no_findings")
          PY
