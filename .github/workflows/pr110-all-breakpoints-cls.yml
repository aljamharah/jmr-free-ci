name: PR110 post-merge production code CLS across five viewports
on:
  push:
    branches: [ci/pr110-all-breakpoints-cls-20261113]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: aljamharah/aljamharah
          ref: 688275cb78d4e1014ec683cee4db8e4a0c7c0937
          token: ${{ secrets.JMR_PRIVATE_REPO_READ_TOKEN }}
          path: baseline
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/checkout@v4
        with:
          repository: aljamharah/aljamharah
          ref: c6c3f3731941ec06e42a6a548c60b2c124c9ba16
          token: ${{ secrets.JMR_PRIVATE_REPO_READ_TOKEN }}
          path: candidate
          persist-credentials: false
          fetch-depth: 80
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Confirm exact deployed Production merge and original baseline
        run: |
          set -euo pipefail
          test "$(git -C baseline rev-parse HEAD)" = "688275cb78d4e1014ec683cee4db8e4a0c7c0937"
          test "$(git -C candidate rev-parse HEAD)" = "c6c3f3731941ec06e42a6a548c60b2c124c9ba16"
          echo "POST_MERGE_EXACT_SHA_PASS"
      - name: Build both sanitized sites
        run: |
          (cd baseline && node scripts/build_public_site.mjs)
          (cd candidate && node scripts/build_public_site.mjs)
      - name: Verify exact published tree parity except library page
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          def collect(root):
              return {str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest()
                      for p in root.rglob("*") if p.is_file()}
          old=collect(Path("baseline/dist")); new=collect(Path("candidate/dist"))
          assert old.keys()==new.keys(),f"Published path drift: baseline={len(old)} production={len(new)}"
          diff=sorted(k for k in old if old[k]!=new[k])
          assert diff==["library.html"],f"Unexpected public output drift: {diff[:20]}"
          print("POST_MERGE_DIST_PARITY_PASS public_files="+str(len(old))+" changed=library.html only")
          PY
      - name: Install Chrome
        run: npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright
      - name: Compare CLS, geometry and cards on five breakpoints
        run: |
          node --input-type=module <<'NODE'
          import {chromium} from "playwright";
          import assert from "node:assert/strict";
          import {readFile} from "node:fs/promises";
          import {createServer} from "node:http";
          import {resolve,sep,extname} from "node:path";
          const mim={".html":"text/html; charset=utf-8",".css":"text/css",".js":"text/javascript",".mjs":"text/javascript",".json":"application/json",".png":"image/png",".webp":"image/webp",".svg":"image/svg+xml"};
          async function site(folder){
            const root=resolve(folder);
            const server=createServer(async(req,res)=>{
              let part;try{part=decodeURIComponent(new URL(req.url,"http://localhost").pathname)}catch{res.writeHead(400);res.end();return}
              const p=resolve(root,"."+ (part==="/"?"/index.html":part));
              if(!p.startsWith(root+sep)){res.writeHead(403);res.end();return}
              try{const data=await readFile(p);res.setHeader("Content-Type",mim[extname(p)]||"application/octet-stream");res.end(data)}catch{res.writeHead(404);res.end()}
            });
            await new Promise(r=>server.listen(0,"127.0.0.1",r));
            return {server,url:"http://127.0.0.1:"+server.address().port};
          }
          const sites={baseline:await site("baseline/dist"),candidate:await site("candidate/dist")};
          let browser;
          try{browser=await chromium.launch({channel:"chrome",headless:true,args:["--no-sandbox"]})}
          catch{browser=await chromium.launch({headless:true,args:["--no-sandbox"]})}
          try{
            for(const width of [320,390,600,768,1280]){
              const result={};
              for(const name of ["baseline","candidate"]){
                const context=await browser.newContext({viewport:{width,height:844},locale:"ar",reducedMotion:"reduce"});
                await context.route("**/*",route=>route.request().method()==="GET"?route.continue():route.abort());
                const page=await context.newPage(),errors=[];
                page.on("pageerror",e=>errors.push(e.message));
                await page.addInitScript(()=>{
                  window.__cls=0;
                  new PerformanceObserver(list=>{for(const e of list.getEntries())if(!e.hadRecentInput)window.__cls+=e.value}).observe({type:"layout-shift",buffered:true});
                });
                const cdp=await context.newCDPSession(page);
                await cdp.send("Network.enable");
                await cdp.send("Network.setCacheDisabled",{cacheDisabled:true});
                await cdp.send("Network.emulateNetworkConditions",{offline:false,latency:150,downloadThroughput:250000,uploadThroughput:125000});
                await cdp.send("Emulation.setCPUThrottlingRate",{rate:4});
                const response=await page.goto(sites[name].url+"/library.html",{waitUntil:"load",timeout:70000});
                await page.locator("#categories .category").first().waitFor({timeout:12000});
                await page.waitForTimeout(900);
                result[name]=await page.evaluate(()=>({cls:+window.__cls.toFixed(4),cards:document.querySelectorAll("#categories .category").length,height:Math.round(document.querySelector("#categories").getBoundingClientRect().height),overflow:Math.max(0,document.documentElement.scrollWidth-innerWidth)}));
                assert.equal(response.status(),200);
                assert.equal(result[name].cards,6);
                assert.equal(result[name].overflow,0);
                assert.deepEqual(errors,[]);
                await context.close();
              }
              console.log("CLS_WIDTH "+JSON.stringify({width,...result}));
              assert.equal(result.candidate.height,result.baseline.height,"Final design geometry drift at "+width);
              assert.ok(result.candidate.cls<=result.baseline.cls+0.015,"CLS worsened at width "+width);
            }
            console.log("ALL_BREAKPOINTS_GATE PASS widths=320,390,600,768,1280 no layout regression");
          }finally{await browser.close();await Promise.all(Object.values(sites).map(x=>new Promise(r=>x.server.close(r))))}
          NODE
