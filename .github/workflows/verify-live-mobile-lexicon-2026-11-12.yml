name: Verify merged mobile lexicon optimization on live Pages
on:
  push:
    branches: [ci/lexicon-mobile-live-2026-11-12]
permissions:
  contents: read
jobs:
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify published lexicon uses bounded cache and public index
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const base='https://aljamharah.pages.dev';
          let published=false;
          for(let attempt=0; attempt<15; attempt++){
            const r=await fetch(base+'/lexicon.html',{headers:{'Cache-Control':'no-cache'},signal:AbortSignal.timeout(12000)});
            const s=await r.text();
            published=r.status===200&&s.includes('const MAX_COMPACT_SHARDS=4;')&&s.includes('pendingCompactLexiconShards');
            if(published)break;
            await new Promise(res=>setTimeout(res,8000));
          }
          console.log('LEXICON_BOUNDED_CACHE_LIVE',published?'PASS':'NOT_YET_DEPLOYED');
          const manifest=await fetch(base+'/content/jmr/lexicon/manifest.json',{signal:AbortSignal.timeout(12000)});
          const data=manifest.ok?await manifest.json():null;
          const indexReady=Boolean(data&&data.version===1&&Array.isArray(data.word_prefixes));
          console.log('LEXICON_COMPACT_INDEX_LIVE',JSON.stringify({http:manifest.status,ready:indexReady,prefixCount:data?.word_prefixes?.length}));
          const home=await fetch(base+'/',{signal:AbortSignal.timeout(12000)});
          const ok=home.status===200;
          console.log('HOME_LIVE',JSON.stringify({http:home.status,ok}));
          if(!published||!indexReady||!ok)process.exitCode=1;
          NODE
