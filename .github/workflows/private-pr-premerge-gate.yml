name: Private PR SHA-locked premerge gate (read-only)
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/private-pr-premerge-gate.yml"
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Private PR number"
        required: true
        type: string
      expected_head_sha:
        description: "Exact 40-character PR head SHA"
        required: true
        type: string
      head_branch:
        description: "Same-repository PR head branch (not a fork)"
        required: true
        type: string
      require_dist_parity:
        description: "Enforce byte-identical public dist vs current main"
        type: boolean
        required: true
        default: true
permissions:
  contents: read
concurrency:
  group: jmr-private-pr-premerge
  cancel-in-progress: false
jobs:
  gate:
    if: github.repository == 'aljamharah/jmr-free-ci' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PRIVATE_PR_NUMBER: ${{ github.event_name == 'workflow_dispatch' && inputs.pr_number || '107' }}
      EXPECTED_HEAD_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.expected_head_sha || '987cab06a0ab6d43a31f553f46f08210f346a09f' }}
      EXPECTED_HEAD_BRANCH: ${{ github.event_name == 'workflow_dispatch' && inputs.head_branch || 'architecture/phase3-sec01-audit-test-2026-11-13' }}
      STRICT_DIST_PARITY: ${{ github.event_name != 'workflow_dispatch' || inputs.require_dist_parity == true }}
    steps:
      - name: Pin PR Git ref, same-repository head branch and current main via Contents Read token
        id: pin
        env:
          PRIVATE_REPO_READ_TOKEN: ${{ secrets.JMR_PRIVATE_REPO_READ_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          import {appendFileSync} from 'node:fs';
          import {execFileSync} from 'node:child_process';
          const pr=process.env.PRIVATE_PR_NUMBER;
          const branch=process.env.EXPECTED_HEAD_BRANCH;
          const expected=(process.env.EXPECTED_HEAD_SHA||'').toLowerCase();
          if(!/^[1-9][0-9]{0,5}$/.test(pr||'') || !/^[a-f0-9]{40}$/.test(expected) ||
             !/^[a-zA-Z0-9][a-zA-Z0-9./_-]{0,140}$/.test(branch||'') ||
             branch.includes('..')||branch.includes('//')||branch.endsWith('/')||branch==='main'){
            throw Error('Untrusted PR number, branch, or SHA: no checkout');
          }
          const token=process.env.PRIVATE_REPO_READ_TOKEN;
          if(!token||token.length<12)throw Error('Read-only private source token missing');
          const env={...process.env,
            GIT_CONFIG_COUNT:'1',
            GIT_CONFIG_KEY_0:'http.extraheader',
            GIT_CONFIG_VALUE_0:'AUTHORIZATION: basic '+
              Buffer.from('x-access-token:'+token).toString('base64'),
            GIT_TERMINAL_PROMPT:'0'};
          function refs(){
            let output;
            try{
              output=execFileSync('git',['ls-remote','https://github.com/aljamharah/aljamharah.git',
                  'refs/heads/main','refs/heads/'+branch,'refs/pull/'+pr+'/head'],
                {env,encoding:'utf8',timeout:30000,stdio:['ignore','pipe','pipe']});
            }catch{throw Error('Private Git refs GET failed; token needs Contents Read');}
            return new Map(output.trim().split('\n').filter(Boolean).map(s=>{
              const [sha,ref]=s.split('\t');return [ref,sha];
            }));
          }
          const all=refs(),base=all.get('refs/heads/main');
          if(!/^[a-f0-9]{40}$/.test(base||'')||
             all.get('refs/heads/'+branch)!==expected||
             all.get('refs/pull/'+pr+'/head')!==expected){
            throw Error('PR ref, same-repository branch or SHA drifted; fail closed');
          }
          appendFileSync(process.env.GITHUB_OUTPUT,'base_sha='+base+'\nhead_sha='+expected+'\n');
          console.log('GIT_REF_PIN_OK pr='+pr+' sha='+expected.slice(0,12)+' main='+base.slice(0,12));
          NODE
      - name: Checkout pinned main without retaining credentials
        uses: actions/checkout@v4
        with:
          repository: aljamharah/aljamharah
          ref: ${{ steps.pin.outputs.base_sha }}
          token: ${{ secrets.JMR_PRIVATE_REPO_READ_TOKEN }}
          path: baseline
          persist-credentials: false
      - name: Checkout pinned PR head and history without retaining credentials
        uses: actions/checkout@v4
        with:
          repository: aljamharah/aljamharah
          ref: ${{ steps.pin.outputs.head_sha }}
          token: ${{ secrets.JMR_PRIVATE_REPO_READ_TOKEN }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - name: Create ephemeral local merge against pinned main; never push
        env:
          BASE_SHA: ${{ steps.pin.outputs.base_sha }}
          HEAD_SHA: ${{ steps.pin.outputs.head_sha }}
        run: |
          set -euo pipefail
          test "$(git -C baseline rev-parse HEAD)" = "$BASE_SHA"
          test "$(git -C candidate rev-parse HEAD)" = "$HEAD_SHA"
          git -C candidate cat-file -e "$BASE_SHA^{commit}"
          git -C candidate -c user.name='Ephemeral Audit' -c user.email='audit@invalid.example' merge --no-ff --no-edit "$BASE_SHA" >/dev/null
          echo "Disposable merge completed. No GitHub branch changed."
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install free validation dependencies
        run: python -m pip install --disable-pip-version-check python-frontmatter pyyaml >/dev/null
      - name: Run complete source, Quran, JMR and CMS foundation checks
        working-directory: candidate
        run: |
          set -euo pipefail
          if ! node scripts/check_site_foundation.mjs >/tmp/private-pr-gate-foundation.log 2>&1; then
            echo "::error::Virtual-merge foundation regression tests failed"
            grep '^FAILED:\|^Jamharah technical foundation:' /tmp/private-pr-gate-foundation.log || true
            exit 1
          fi
          grep '^Jamharah technical foundation:' /tmp/private-pr-gate-foundation.log
      - name: Build independent sanitized baseline and candidate
        run: |
          set -euo pipefail
          (cd baseline && node scripts/build_public_site.mjs >/tmp/jmr-baseline-build.log 2>&1) || { echo "::error::Baseline build failed"; exit 1; }
          (cd candidate && node scripts/build_public_site.mjs >/tmp/jmr-candidate-build.log 2>&1) || { echo "::error::Candidate build failed"; exit 1; }
      - name: Check strict published dist parity unless expressly opted out
        env:
          STRICT_DIST_PARITY: ${{ github.event_name != 'workflow_dispatch' || inputs.require_dist_parity == true }}
        run: |
          set -euo pipefail
          if [ "$STRICT_DIST_PARITY" = "true" ]; then
            (cd candidate && node scripts/validation/compare-public-dist.mjs ../baseline/build-reports/dist-inventory.json build-reports/dist-inventory.json)
          else
            echo "::warning::Strict dist parity disabled: manual review of every published output change is MANDATORY."
          fi
      - name: Recheck branch, PR ref and main using Git Contents Read; publish summary
        env:
          PRIVATE_REPO_READ_TOKEN: ${{ secrets.JMR_PRIVATE_REPO_READ_TOKEN }}
          BASE_SHA: ${{ steps.pin.outputs.base_sha }}
          HEAD_SHA: ${{ steps.pin.outputs.head_sha }}
        run: |
          node --input-type=module <<'NODE'
          import {appendFileSync} from 'node:fs';
          import {execFileSync} from 'node:child_process';
          const token=process.env.PRIVATE_REPO_READ_TOKEN;
          const pr=process.env.PRIVATE_PR_NUMBER,branch=process.env.EXPECTED_HEAD_BRANCH;
          const env={...process.env,GIT_CONFIG_COUNT:'1',
            GIT_CONFIG_KEY_0:'http.extraheader',
            GIT_CONFIG_VALUE_0:'AUTHORIZATION: basic '+
              Buffer.from('x-access-token:'+token).toString('base64'),
            GIT_TERMINAL_PROMPT:'0'};
          let output;
          try{
            output=execFileSync('git',['ls-remote','https://github.com/aljamharah/aljamharah.git',
              'refs/heads/main','refs/heads/'+branch,'refs/pull/'+pr+'/head'],
              {env,encoding:'utf8',timeout:30000,stdio:['ignore','pipe','pipe']});
          }catch{throw Error('Final Git ref verification unavailable');}
          const refs=new Map(output.trim().split('\n').filter(Boolean).map(s=>{
            const [sha,ref]=s.split('\t');return [ref,sha];
          }));
          if(refs.get('refs/heads/main')!==process.env.BASE_SHA||
             refs.get('refs/heads/'+branch)!==process.env.HEAD_SHA||
             refs.get('refs/pull/'+pr+'/head')!==process.env.HEAD_SHA){
            throw Error('Main or PR head moved during test: fail closed');
          }
          appendFileSync(process.env.GITHUB_STEP_SUMMARY,
            '# Private PR exact SHA premerge check\n\n'+
            '- PR number and same-repository Git branch refs: matched exact pinned head SHA\n'+
            '- Current main SHA unchanged during test\n'+
            '- Ephemeral local merge: PASS\n'+
            '- Foundation regression tests and sanitized builds: PASS\n'+
            '- Strict static dist parity: '+(process.env.STRICT_DIST_PARITY==='true'?'PASS':'DISABLED; explicit review required')+'\n'+
            '- No remote writes, merges, model requests or Cloudflare changes\n'+
            '- Limitation: Contents Read cannot check whether PR is open/closed; check it before merge.\n'+
            '- Advisory CI evidence ONLY; not enforced branch protection.\n');
          console.log('PREMERGE_GATE_OK pr='+pr+' sha='+process.env.HEAD_SHA.slice(0,12));
          NODE
      - name: Verify no tracked private source mutation
        run: |
          set -euo pipefail
          git -C baseline diff --exit-code
          git -C candidate diff --exit-code
          echo "Tracked source unchanged; no deployment or remote write."
