name: JMR protected Preview access preflight (DO concurrent test deferred)
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/jmr-preview-concurrent-do-guard.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  concurrent-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify Cloudflare Access blocks anonymous Preview before any DO stress test
        run: |
          node --input-type=module <<'NODE'
          const origin = "https://3a239e79.aljamharah.pages.dev";
          if (!/^https:\/\/[a-f0-9]{8}\.aljamharah\.pages\.dev$/.test(origin)) {
            throw Error("Preview origin must be pinned and safe");
          }
          // Access is before API. Anonymous POSTs cannot measure DO rate limiting.
          const r=await fetch(origin+"/api/jmr",{
            method:"GET",redirect:"manual",signal:AbortSignal.timeout(18000)
          });
          const location=r.headers.get("location")||"";
          let knownLogin=false;
          try{
            const u=new URL(location,origin);
            knownLogin=u.protocol==="https:"&&
              (u.hostname.endsWith(".cloudflareaccess.com")||
                (u.origin===origin&&u.pathname.startsWith("/cdn-cgi/access/")));
          }catch{}
          const enforced=[401,403].includes(r.status)||
            ([301,302,303,307,308].includes(r.status)&&knownLogin);
          await r.body?.cancel();
          if(!enforced)throw Error("SECURITY FAILURE: Preview did not require Access authentication");
          const result={preview_access:"ENFORCED",status:r.status,
            do_concurrency:"NOT_TESTED_ACCESS_PROTECTED",
            model_requests:0,malformed_post_requests:0};
          console.log("JMR_PREVIEW_ACCESS "+JSON.stringify(result));
          const {appendFileSync}=await import("node:fs");
          if(process.env.GITHUB_STEP_SUMMARY)appendFileSync(process.env.GITHUB_STEP_SUMMARY,
            "PASS: anonymous Preview is protected by Cloudflare Access. "+
            "SKIPPED: 12/minute concurrent DO test; an approved authenticated "+
            "service credential is not configured. Zero POST and zero AI requests.\n");
          NODE
