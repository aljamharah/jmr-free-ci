name: JMR citation grouping and full Jamharah browser checks

on:
  push:
    branches: [ci/jmr-sources-after-pr50-2026-11-11]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout private engineering branch read only
        uses: actions/checkout@v4
        with:
          repository: aljamharah/aljamharah
          ref: quality/jmr-source-grouping-after-pr50-2026-11-11
          token: ${{ secrets.JMR_PRIVATE_REPO_READ_TOKEN }}
          path: source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Foundation and JMR API regression
        working-directory: source
        run: node scripts/check_site_foundation.mjs
      - name: Free browser framework
        working-directory: source
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          if ! command -v google-chrome >/dev/null 2>&1; then
            npx playwright install --with-deps chromium
          fi
      - name: Actual mobile and desktop HTML interaction tests with no paid AI
        working-directory: source
        run: node scripts/test_browser_navigation.mjs
      - name: Confirm no tracked source changes from tests
        working-directory: source
        run: git diff --exit-code -- .
