name: Get edition-based vocalized classics Labid and Zuhayr
on:
  push:
    branches: [audit/labid-voweled-source-20261118]
permissions: {contents: read}
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Retrieve poems from documented historical edition only
        run: |
          python -m pip -q install requests beautifulsoup4
          python - <<'PY'
          import requests,bs4,json,time
          for key in ['labid','zuhayr']:
            url='https://mouallakat.com/poems/'+key+'/'
            try:
              r=requests.get(url,timeout=25,headers={'User-Agent':'Mozilla/5.0'});r.raise_for_status();r.encoding='utf-8'
              soup=bs4.BeautifulSoup(r.text,'html.parser')
              lines=[]
              for bayt in soup.select('article.verse'):
                parts=bayt.select('div.verse-lines > p')
                if len(parts)!=2: continue
                lines.extend([' '.join(word.get_text(' ',strip=True) for word in part.select('span.word')) for part in parts])
              print('EXTRACT',key,'LINES',len(lines),'FIRST',repr(lines[:2]),'LAST',repr(lines[-2:]),flush=True)
              if len(lines)>20 and len(lines)%2==0:
                print('PUBLIC_POEM_JSON',json.dumps({'key':key,'url':r.url,'lines':lines},ensure_ascii=False,separators=(',',':')),flush=True)
            except Exception as e:print('ERROR',key,str(e)[:180])
            time.sleep(.25)
          PY
