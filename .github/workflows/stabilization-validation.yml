name: Validate Al-Jamharah stabilization
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/stabilization-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validation:
    if: github.actor == 'aljamharah'
    runs-on: ubuntu-latest
    steps:
      - name: Require private read-only source token
        env:
          PRIVATE_TOKEN: ${{ secrets.JMR_PRIVATE_REPO_READ_TOKEN }}
        run: |
          if [ -z "$PRIVATE_TOKEN" ]; then
            echo "::error::Missing read-only token for canonical private source."
            exit 1
          fi
      - name: Checkout trusted stabilization source (read only)
        uses: actions/checkout@v4
        with:
          repository: aljamharah/aljamharah
          ref: stabilization/2026-11-11-safe-foundation
          token: ${{ secrets.JMR_PRIVATE_REPO_READ_TOKEN }}
          persist-credentials: false
          path: private-source
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check python-frontmatter pyyaml
      - name: Validate library, rights approvals and private routes
        working-directory: private-source
        run: python scripts/validate_library.py
      - name: Check lightweight lexicon script syntax
        working-directory: private-source
        run: node --check assets/lexicon-lite.js
      - name: Run stabilization regression tests
        working-directory: private-source
        run: node --test tests/stabilization.test.mjs
