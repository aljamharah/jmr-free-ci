name: SEC01 verify every reported historic Pages URL is covered by anonymous Access

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/sec01-historical-preview-access-coverage.yml"
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1' # Monday 04:17 UTC; keeps API/runner usage bounded


permissions:
  contents: read

concurrency:
  group: sec01-historical-access-reported-url-coverage
  cancel-in-progress: false

jobs:
  coverage:
    if: github.repository == 'aljamharah/jmr-free-ci' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read-only snapshot, no cookies or response bodies, verify Access and public canonical
        env:
          ACCOUNT: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          TOKEN: ${{ secrets.ALJAMHARAH_CF_MAINTENANCE_TOKEN }}
        run: |
          set +e
          for attempt in 1 2 3; do
            node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          try {
          const account=process.env.ACCOUNT,token=process.env.TOKEN;
          assert.match(account||'',/^[a-f0-9]{32}$/i,'Missing account configuration');
          assert.ok(token?.length>=12,'Missing existing Pages API read credential');
          const projects=['aljamharah','aljamharah-staging'],environments=['production','preview'];
          const tasks=new Map(),summaries={},seenIDs=new Set(),branchCandidates=new Map();
          let previewBranchMissing=0,previewBranchInvalid=0;
          let configuredCustomDomains=0;
          const api='https://api.cloudflare.com/client/v4/accounts/'+account+'/pages/projects/';
          async function getCloudflare(path){
            const r=await fetch(api+path,{method:'GET',redirect:'error',headers:{
              Authorization:'Bearer '+token,Accept:'application/json'},signal:AbortSignal.timeout(20000)});
            if(!r.ok)throw Error('Cloudflare GET status '+r.status);
            const j=await r.json();
            if(j?.success!==true)throw Error('Cloudflare GET rejected');
            return j;
          }
          function validateOrigin(raw,project){
            if(typeof raw!=='string'||raw.length>1024||/\s/.test(raw))return null;
            try{
              const u=new URL(raw),host=project+'.pages.dev';
              if(u.protocol!=='https:'||u.username||u.password||u.port||
                 u.pathname!=='/'||u.search||u.hash)return null;
              if(u.hostname===host)return {kind:'canonical_public',origin:u.origin};
              if(!u.hostname.endsWith('.'+host))return null;
              const prefix=u.hostname.slice(0,-host.length-1);
              if(!/^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$/.test(prefix))return null;
              return {kind:'preview_host',origin:u.origin};
            }catch{return null;}
          }
          function addTarget(origin,path,project,type){
            const key=origin+'|'+path;
            if(!tasks.has(key))tasks.set(key,{origin,path,project,type});
          }
          for(const project of projects){
            const metadata=(await getCloudflare(project)).result;
            if(metadata?.name!==project||metadata.build_config?.destination_dir!=='dist')
              throw Error('Unexpected Pages project build configuration');
            const customDomains=await getCloudflare(project+'/domains');
            if(!Array.isArray(customDomains.result)||
               (Number.isSafeInteger(customDomains.result_info?.total_count)&&
                customDomains.result_info.total_count!==customDomains.result.length))
              throw Error('Pages custom-domain inventory incomplete');
            configuredCustomDomains+=customDomains.result.length;
            for(const env of environments){
              const stat={listed:0,legacy_raw_root:0,alias_fields_not_reported:0,
                reported_alias_entries:0,canonical_alias_skipped:0,unknown_hosts:0,
                checked_deployment_url:0,checked_alias:0};
              summaries[project+'/'+env]=stat;
              const prefix=project+'/deployments?env='+env+'&per_page=25&page=';
              const first=await getCloudflare(prefix+'1');
              const info0=first.result_info;
              if(!info0||!Number.isSafeInteger(info0.total_count)||
                 !Number.isSafeInteger(info0.total_pages)||!Number.isSafeInteger(info0.per_page)||
                 info0.per_page<1||info0.per_page>25||info0.total_count<0||
                 info0.total_pages!==(info0.total_count===0?0:Math.ceil(info0.total_count/info0.per_page))||
                 info0.total_pages>100)throw Error('Invalid initial Pages pagination');
              const ids=new Set();
              for(let page=1;page<=Math.max(info0.total_pages,1);page++){
                const row=page===1?first:await getCloudflare(prefix+page);
                const info=row.result_info;
                if(!Array.isArray(row.result)||info?.page!==page||
                   info?.total_count!==info0.total_count||
                   info?.total_pages!==info0.total_pages||
                   info?.per_page!==info0.per_page||
                   row.result.length>info.per_page||
                   (page<info0.total_pages&&row.result.length!==info.per_page))
                  throw Error('Inventory changed while reading Pages listing');
                for(const d of row.result){
                  if(!d||typeof d.id!=='string'||ids.has(d.id)||seenIDs.has(d.id)||
                     d.project_name!==project||d.environment!==env)
                    throw Error('Invalid or duplicate Pages deployment');
                  ids.add(d.id);seenIDs.add(d.id);stat.listed++;
                  const primary=validateOrigin(d.url,project);
                  if(!primary||primary.kind!=='preview_host'){
                    stat.unknown_hosts++;continue;
                  }
                  const legacy=d.build_config?.destination_dir==='';
                  if(legacy)stat.legacy_raw_root++;
                  addTarget(primary.origin,legacy?'/database/schema.sql':'/',project,'deployment');
                  stat.checked_deployment_url++;
                  // Documented Cloudflare Pages branch normalization, not proof an alias exists.
                  // Only derive candidates from deployment metadata, never arbitrary names.
                  if(env==='preview'){
                    const branch=d.deployment_trigger?.metadata?.branch;
                    if(typeof branch!=='string'||!branch)previewBranchMissing++;
                    else {
                      const label=branch.toLowerCase().replace(/[^a-z0-9]/g,'-');
                      const candidate=validateOrigin('https://'+label+'.'+project+'.pages.dev',project);
                      if(!/^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$/.test(label)||
                         candidate?.kind!=='preview_host')previewBranchInvalid++;
                      else branchCandidates.set(candidate.origin+'|/',{origin:candidate.origin,path:'/',project,type:'derived'});
                    }
                  }
                  if(d.aliases==null)stat.alias_fields_not_reported++;
                  else{
                    if(!Array.isArray(d.aliases))throw Error('Invalid alias list');
                    for(const raw of d.aliases){
                      stat.reported_alias_entries++;
                      const alias=validateOrigin(raw,project);
                      if(!alias){stat.unknown_hosts++;continue;}
                      if(alias.kind==='canonical_public'){
                        stat.canonical_alias_skipped++;continue;
                      }
                      addTarget(alias.origin,'/',project,'alias');stat.checked_alias++;
                    }
                  }
                }
              }
              if(ids.size!==info0.total_count)throw Error('Inventory incomplete or count changed');
            }
          }
          const metrics={access_login:0,access_denied:0,public_200:0,unknown_redirect:0,
            other_status:0,network_error:0,verified_deployment_urls:0,verified_alias_routes:0};
          const outcomes={};
          let cursor=0;
          function accessRedirect(location,origin){
            if(!location)return false;
            try{
              const u=new URL(location,origin);
              return u.protocol==='https:'&&!u.username&&!u.password&&(
                u.hostname.endsWith('.cloudflareaccess.com')||
                (u.origin===origin&&u.pathname.startsWith('/cdn-cgi/access/')));
            }catch{return false}
          }
          const reportedWork=[...tasks.values()];
          const derivedWork=[...branchCandidates.entries()].filter(([k])=>!tasks.has(k)).map(([,v])=>v);
          const derivedMetrics={access_login:0,access_denied:0,public_200:0,unknown_redirect:0,other_status:0,network_error:0};
          const work=[...reportedWork,...derivedWork];
          async function runTask(t){
            let classification='network_error';
            try{
              const r=await fetch(t.origin+t.path,{method:'GET',redirect:'manual',
                headers:{Accept:'text/html,application/json','Cache-Control':'no-cache'},
                signal:AbortSignal.timeout(18000)});
              if([301,302,303,307,308].includes(r.status)&&
                 accessRedirect(r.headers.get('location'),t.origin))
                classification='access_login';
              else if(r.status===401||r.status===403)classification='access_denied';
              else if(r.status===200)classification='public_200';
              else if([301,302,303,307,308].includes(r.status))classification='unknown_redirect';
              else classification='other_status';
              await r.body?.cancel().catch(()=>{});
            }catch{}
            if(t.type==='derived'){derivedMetrics[classification]++;return;}
            metrics[classification]++;
            if(!outcomes[t.project])outcomes[t.project]={verified:0,unverified:0};
            // Generic HTTP 401/403 might be WAF/origin denial, not proof of Access.
            // Only a verified Cloudflare Access login redirect establishes Access coverage.
            const protectedNow=classification==='access_login';
            if(protectedNow){outcomes[t.project].verified++;
              if(t.type==='deployment')metrics.verified_deployment_urls++;
              else metrics.verified_alias_routes++;
            }else outcomes[t.project].unverified++;
          }
          async function worker(){
            while(cursor<work.length){
              const t=work[cursor++];
              if(t)await runTask(t);
            }
          }
          await Promise.all(Array.from({length:8},()=>worker()));
          let production_public=0,production_nonpublic=0;
          for(const project of projects){
            const origin='https://'+project+'.pages.dev';
            try{
              const r=await fetch(origin+'/',{method:'GET',redirect:'manual',
                signal:AbortSignal.timeout(18000)});
              if(r.status===200)production_public++;
              else production_nonpublic++;
              await r.body?.cancel().catch(()=>{});
            }catch{production_nonpublic++;}
          }
          const unreported_alias_lists=Object.values(summaries).reduce((n,x)=>n+x.alias_fields_not_reported,0);
          const unknown_hosts=Object.values(summaries).reduce((n,x)=>n+x.unknown_hosts,0);
          const report={test:'SEC01 anonymous historical Pages Access coverage',
            read_only:true,listed_deployments:seenIDs.size,
            unique_checked_routes:reportedWork.length,
            derived_branch_candidates:branchCandidates.size,
            derived_additional_routes:derivedWork.length,
            derived_protection_results:derivedMetrics,
            preview_branch_metadata_missing:previewBranchMissing,
            preview_branch_label_invalid:previewBranchInvalid,
            derived_candidates_all_access_login:derivedMetrics.access_login===derivedWork.length&&previewBranchMissing===0&&previewBranchInvalid===0,
            total_checked_deployment_urls:metrics.verified_deployment_urls,
            total_checked_reported_alias_routes:metrics.verified_alias_routes,
            unreported_alias_lists,unknown_hosts,configured_custom_domains:configuredCustomDomains,
            protection_results:metrics,per_project:outcomes,
            canonical_production_200:production_public,
            canonical_production_not_200:production_nonpublic,
            all_reported_urls_protected:metrics.public_200===0&&metrics.unknown_redirect===0&&
              metrics.other_status===0&&metrics.network_error===0&&unknown_hosts===0&&
              metrics.access_login===reportedWork.length&&metrics.access_denied===0&&configuredCustomDomains===0,
            all_alias_urls_known:unreported_alias_lists===0,
            response_bodies_logged:false,hosts_ids_secrets_logged:false,
            cloudflare_mutations:0,ai_model_calls:0,
            historical_deletion_approved:false};
          // Publish aggregate-only, reviewable evidence on the GitHub run summary.
          // Never print URLs, Access identities, headers, tokens or response bodies.
          if (process.env.GITHUB_STEP_SUMMARY) {
            const {appendFile}=await import('node:fs/promises');
            const partial=report.unreported_alias_lists>0;
            const lines=[
              '## SEC-01 — Historical Pages Access coverage',
              '',
              '**Scope: API-reported URLs plus separately classified metadata-derived branch candidates.**',
              'A successful check does NOT prove that omitted historical aliases never existed,',
              'nor does it establish whether material was accessed before Access was enabled.',
              '',
              '| Safe aggregate metric | Result |',
              '| --- | ---: |',
              '| Checked API-reported unique routes | '+report.unique_checked_routes+' |',
              '| Additional metadata-derived branch candidates checked | '+derivedWork.length+' |',
              '| Derived candidates with Access login | '+derivedMetrics.access_login+' |',
              '| Derived candidates unverified | '+(derivedWork.length-derivedMetrics.access_login)+' |',
              '| Preview records with missing/invalid branch metadata | '+(previewBranchMissing+previewBranchInvalid)+' |',
              '| Verified Access login redirects | '+metrics.access_login+' |',
              '| Public HTTP 200 on protected preview routes | '+metrics.public_200+' |',
              '| Unverified routes (including network errors) | '+(reportedWork.length-metrics.access_login)+' |',
              '| Deployment entries without an alias list | '+report.unreported_alias_lists+' |',
              '| Unknown/unrecognized hosts | '+report.unknown_hosts+' |',
              '| Configured Pages custom domains | '+report.configured_custom_domains+' |',
              '| Expected canonical public roots returning 200 | '+report.canonical_production_200+' / 2 |',
              '',
              '**Reported-route coverage:** '+(report.all_reported_urls_protected?'PASS':'FAIL'),
              '',
              '**All historical aliases accounted for:** '+(partial?'NOT PROVEN':'API INVENTORY COMPLETE (not an external-history guarantee)'),
              '',
              'When coverage fails, review this workflow run promptly. Never publish historical URLs',
              'or sensitive source snippets in public CI logs. Track remaining evidence in private SEC-01 #113.',
              ''
            ];
            await appendFile(process.env.GITHUB_STEP_SUMMARY,lines.join('\n')+'\n');
          }
          console.log(JSON.stringify(report,null,2));
          if(unreported_alias_lists>0)
            console.log('::warning title=Unreported Pages alias fields::'+unreported_alias_lists+
              ' deployments omit alias lists; total historical alias coverage remains unproven.');
          if(configuredCustomDomains>0)
            console.log('::error title=Unverified custom Pages domains::'+configuredCustomDomains+
              ' custom domains require an independent Access audit.');
          if(!report.derived_candidates_all_access_login)
            console.log('::error title=Derived branch coverage incomplete::Some documented branch candidates lack verified Access redirects or usable metadata; investigate without printing names.');
          if(!report.all_reported_urls_protected||production_public!==2||!report.derived_candidates_all_access_login)
            throw Error('Historical Access coverage or canonical production safety cannot be accepted');
          console.log('PASS: API-reported routes and metadata-derived branch candidates returned Access login; canonical production is public. Unknown historical aliases remain unverified.');
          } catch (e) {
            if (e?.message === 'Inventory changed while reading Pages listing') {
              console.log('::warning title=Cloudflare inventory drift::Deployment list changed during pagination; rerunning a fresh complete inventory.');
              process.exitCode = 75;
            } else { throw e; }
          }
          NODE
            code=$?
            if [ "$code" -eq 0 ]; then exit 0; fi
            if [ "$code" -ne 75 ]; then exit "$code"; fi
            if [ "$attempt" -lt 3 ]; then sleep 7; fi
          done
          echo '::error title=Cloudflare inventory unstable::3 complete snapshots failed due to concurrent changes; no protection verdict was issued.'
          exit 1

      - name: Record unresolved SEC-01 coverage failure
        if: failure()
        run: |
          echo '::error title=SEC-01 monitoring incomplete::Historic-preview protection has not been proven by this run; inspect the aggregated check and investigate before accepting an Access change.'
          {
            echo '### SEC-01 — coverage incomplete'
            echo 'This run did not produce an acceptable coverage verdict. Do not interpret an earlier green check as coverage of new deployments.'
            echo 'Review the failed step and private SEC-01 #113. Do not publish historical URLs or source excerpts in this public repository.'
          } >> "$GITHUB_STEP_SUMMARY"
