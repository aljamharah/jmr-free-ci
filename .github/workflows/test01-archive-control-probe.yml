name: TEST-01 Archive control diagnostic
on:
  pull_request:
    branches: [main]
    paths: [".github/workflows/test01-archive-control-probe.yml"]
permissions:
  contents: read
jobs:
  probe:
    if: github.repository == 'aljamharah/jmr-free-ci' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'test/test01-production-reader-matrix-control-probe-20261124'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Probe actual public controls, no model or secrets
        run: |
          cd "$RUNNER_TEMP"
          npm install --no-audit --no-fund --no-save playwright@1.56.1 pngjs@7.0.0 >/dev/null
          cat > probe.mjs <<'JS'
          import {chromium} from 'playwright';
          import {createHash} from 'node:crypto';
          import {PNG} from 'pngjs';
          const base='https://aljamharah.pages.dev';
          const browser=await chromium.launch({channel:'chrome',headless:true});
          const ctx=await browser.newContext({viewport:{width:1280,height:900},locale:'ar',serviceWorkers:'block'});
          await ctx.route('**/*',r=>{
            const u=new URL(r.request().url());
            return ['GET','HEAD'].includes(r.request().method())&&u.protocol==='https:'&&
              (u.origin===base&&!u.pathname.startsWith('/api/')||u.hostname==='archive.org'||u.hostname.endsWith('.archive.org'))?r.continue():r.abort();
          });
          const state=()=> {
            const br=[window.br,window.bookReader,window.bookreader,window.BookReader?.instance].find(x=>x&&typeof x.currentIndex==='function');
            const imgs=[...document.querySelectorAll('#BookReader img,.BRpagecontainer img,img.BRpageimage')].filter(x=>x.complete&&x.naturalWidth>=100);
            const visible=imgs.filter(x=>{const r=x.getBoundingClientRect();return r.width>10&&r.height>10&&r.bottom>0&&r.top<innerHeight&&r.right>0&&r.left<innerWidth});
            return {index:br?.currentIndex(),numLeafs:typeof br?.getNumLeafs==='function'?br.getNumLeafs():null,mode:br?.mode,hash:location.hash,
              images:visible.map(x=>({src:x.currentSrc||x.src,rect:[x.offsetLeft,x.offsetTop,x.offsetWidth,x.offsetHeight]})),
              controls:[...document.querySelectorAll('button.BRicon, .BRnavCntlNxt, button[title="Next page"],button[aria-label="Next page"]')].map(x=>({cls:x.className,title:x.title,label:x.getAttribute('aria-label'),disabled:x.disabled,visible:!!x.getClientRects().length})).slice(0,25)};
          };
          function safe(s){return {...s,images:s.images.map(x=>({...x,src:createHash('sha256').update(x.src).digest('hex').slice(0,10)}))}}
          const page=await ctx.newPage();
          await page.goto(base+'/book.html?id=akhfash-qawafi',{waitUntil:'domcontentloaded',timeout:25000});
          const iframe=page.locator('#bookPanel .waqf-reader-frame').first();
          await iframe.waitFor({state:'visible'});await iframe.scrollIntoViewIfNeeded();
          const src=await iframe.getAttribute('src');
          const frame=await (await iframe.elementHandle()).contentFrame();
          for(const [label,target] of [['embedded',frame],['direct',null]]){
            const p=target?page:await ctx.newPage();
            const f=target||p.mainFrame();
            if(!target)await p.goto(src,{waitUntil:'domcontentloaded',timeout:25000});
            await f.waitForFunction(()=>[...document.querySelectorAll('#BookReader img,.BRpagecontainer img,img.BRpageimage')].some(x=>x.complete&&x.naturalWidth>=100),null,{timeout:25000});
            console.log('ARCHIVE_PROBE_INITIAL '+label+' '+JSON.stringify(safe(await f.evaluate(state))));
            for(const selector of ['button.BRicon.book_right','button.BRicon.book_left','button[title="Next page"]','button[aria-label="Next page"]']){
              const c=f.locator(selector).first();
              if(!await c.isVisible().catch(()=>false))continue;
              const before=safe(await f.evaluate(state));
              let clicked=true;
              try{await c.click({timeout:3000})}catch{clicked=false}
              await p.waitForTimeout(1500);
              const after=safe(await f.evaluate(state));
              console.log('ARCHIVE_PROBE_CLICK '+JSON.stringify({label,selector,clicked,before:{index:before.index,hash:before.hash,images:before.images},after:{index:after.index,hash:after.hash,images:after.images}}));
            }
            if(!target)await p.close();
          }
          await browser.close();
          JS
          node probe.mjs
