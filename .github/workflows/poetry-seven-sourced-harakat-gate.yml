name: Validate seven sourced Arabic poetry red-harakat edits
on:
  push:
    branches: [audit/poetry-verified-sources-seven-20261118]
permissions:
  contents: read
jobs:
  verify:
    if: github.repository == 'aljamharah/jmr-free-ci'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Exact private revision read only
        uses: actions/checkout@v4
        with:
          repository: aljamharah/aljamharah
          ref: 667b683b797bdea96d5f65a596062e4c0cc60474
          token: ${{ secrets.JMR_PRIVATE_REPO_READ_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install public free validator dependencies
        run: python -m pip install --disable-pip-version-check python-frontmatter pyyaml
      - name: Verify private commit SHA is pinned
        run: test "$(git rev-parse HEAD)" = '667b683b797bdea96d5f65a596062e4c0cc60474'
      - name: Source-collated harakat and poem viewer regression tests
        run: node --test tests/editorial/poetry-source-collation-harakat.test.mjs tests/editorial/poetry-fixed-particles-harakat.test.mjs tests/poem-red-diacritics-runtime.test.mjs tests/poem-red-diacritics-no-heading.test.mjs tests/poem-reading-compact-height.test.mjs
      - name: Library and complete poem structure tests
        run: |
          node --test tests/editorial/poems-completeness-regression.test.mjs tests/editorial/maari-batch01-index.test.mjs
          python scripts/validate_library.py
      - name: General site, repository and safety regression suite
        run: |
          node scripts/check_site_foundation.mjs
          npm test
      - name: Verify safe static public deployment build
        run: node scripts/build_public_site.mjs
      - name: Confirm no files modified during testing
        run: git diff --exit-code -- content/poems.json poem.html
