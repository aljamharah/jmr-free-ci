name: Verify J-06 planned section navigation and public build
on:
  push:
    branches:
      - ci/j06-deferred-routes-2026-11-12
permissions:
  contents: read
jobs:
  catalog-navigation:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          repository: aljamharah/aljamharah
          ref: fix/j06-reserved-section-routes-2026-11-12
          token: ${{ secrets.JMR_PRIVATE_REPO_READ_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test reserved navigation and existing routes
        run: node --test tests/navigation-deferred-sections.test.mjs
      - name: Confirm sanitized public site builds
        run: node scripts/build_public_site.mjs
      - name: Confirm compiled catalog has the new navigation handler
        run: |
          grep -q "function renderDeferredSection(key)" dist/catalog.html
          test ! -d dist/scripts
          test ! -d dist/database
          test ! -d dist/workers
