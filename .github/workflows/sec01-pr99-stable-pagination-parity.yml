name: SEC01 PR99 paginated-total integrity virtual merge and strict static parity

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/sec01-pr99-stable-pagination-parity.yml"

permissions:
  contents: read

concurrency:
  group: sec01-pr99-stable-pagination-parity-2026-11-13
  cancel-in-progress: false

jobs:
  validate:
    if: github.repository == 'aljamharah/jmr-free-ci' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Require existing private source read-only credential
        env:
          TOKEN: ${{ secrets.JMR_PRIVATE_REPO_READ_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::Private repository read-only credential missing"
            exit 1
          fi

      - name: Checkout latest reviewed production source read only
        uses: actions/checkout@v4
        with:
          repository: aljamharah/aljamharah
          ref: 3c8f99d46ee7cbd461a6f6da944d7089759f2e1c
          token: ${{ secrets.JMR_PRIVATE_REPO_READ_TOKEN }}
          persist-credentials: false
          path: baseline

      - name: Checkout pinned SEC01 PR99 candidate with read-only history
        uses: actions/checkout@v4
        with:
          repository: aljamharah/aljamharah
          ref: 0611b2da7a17eeac669b19923dd4fbd3b68a39d8
          fetch-depth: 0
          token: ${{ secrets.JMR_PRIVATE_REPO_READ_TOKEN }}
          persist-credentials: false
          path: candidate

      - name: Check exact SHA and produce disposable local merge, never push
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C baseline rev-parse HEAD)" = "3c8f99d46ee7cbd461a6f6da944d7089759f2e1c"
          test "$(git -C candidate rev-parse HEAD)" = "0611b2da7a17eeac669b19923dd4fbd3b68a39d8"
          git -C candidate cat-file -e 3c8f99d46ee7cbd461a6f6da944d7089759f2e1c^{commit}
          git -C candidate -c user.name='Read-only SEC01 Merge Probe' \
            -c user.email='ci@invalid.example' \
            merge --no-ff --no-edit 3c8f99d46ee7cbd461a6f6da944d7089759f2e1c
          echo "Local disposable merge created, no branch write or push."

      - name: Require exactly three modified security audit files; forbid other source changes
        shell: bash
        run: |
          set -euo pipefail
          git -C candidate diff --name-status 3c8f99d46ee7cbd461a6f6da944d7089759f2e1c HEAD > /tmp/sec01-changes.txt
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          const changed=readFileSync('/tmp/sec01-changes.txt','utf8')
            .trim().split('\n').filter(Boolean).sort();
          const expected=[
            'docs/security/SEC01-READONLY-DEPLOYMENT-AUDIT-2026-11-13-AR.md',
            'scripts/security/audit-pages-deployments.mjs',
            'tests/sec01-readonly-deployments.test.mjs'
          ].map(x=>'M\t'+x).sort();
          assert.deepEqual(changed,expected);
          console.log('Only 3 existing SEC01 docs/tool/test files modified; no other main changes/deletions.');
          NODE

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install free foundation test dependencies only
        run: python -m pip install --disable-pip-version-check python-frontmatter pyyaml

      - name: Verify exact SEC01 tool syntax and mocked GET-only regression tests
        working-directory: candidate
        run: |
          node --check scripts/security/audit-pages-deployments.mjs
          node --test tests/sec01-readonly-deployments.test.mjs

      - name: Run complete foundation regressions for virtual merge
        working-directory: candidate
        run: node scripts/check_site_foundation.mjs

      - name: Independently build static publish assets from each reviewed tree
        shell: bash
        run: |
          set -euo pipefail
          (cd baseline && node scripts/build_public_site.mjs)
          (cd candidate && node scripts/build_public_site.mjs)

      - name: Verify exact static dist SHA256 and path parity
        working-directory: candidate
        run: |
          node scripts/validation/compare-public-dist.mjs \
            ../baseline/build-reports/dist-inventory.json \
            build-reports/dist-inventory.json

      - name: No tracked changes, secrets or production resource writes
        shell: bash
        run: |
          set -euo pipefail
          git -C baseline diff --exit-code
          git -C candidate diff --exit-code
          echo "Read-only source gate complete; no Cloudflare calls, deploy, branch write, model call, deletions or artifacts."
